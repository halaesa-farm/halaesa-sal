<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Halaesa — Controllo OS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --forest:#1F5C2E; --forest-d:#16441F; --moss:#6FA84A; --lime:#C6DFA3;
  --gold:#E8A33D; --paper:#FAFAF7; --ink:#1A2418; --mut:#6B7565;
  --line:#E2E5DC; --white:#FFFFFF; --red:#C0392B;
  --r:12px; --r-s:8px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--paper);color:var(--ink);font-size:16px;line-height:1.45;
  padding-bottom:84px}
h1,h2,h3{line-height:1.2}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;
  padding:12px;border:1.5px solid var(--line);border-radius:var(--r-s);
  background:var(--white);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--moss);border-color:var(--moss)}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.req::after{content:" •";color:var(--gold);font-weight:900}

/* ---------- struttura ---------- */
.hdr{background:var(--forest);color:var(--white);padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50}
.hdr .brand{font-weight:800;letter-spacing:.02em;font-size:17px}
.hdr .brand small{display:block;font-weight:500;font-size:11px;opacity:.75;letter-spacing:.08em;text-transform:uppercase}
.hdr .who{text-align:right;font-size:12px;opacity:.9}
.hdr .who b{display:block;font-size:13px}
.wrap{max-width:680px;margin:0 auto;padding:16px}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:14px}
.card h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--forest);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .n{background:var(--lime);color:var(--forest-d);width:24px;height:24px;
  border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800}
.field{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.muted{color:var(--mut);font-size:13px}
.btn{display:block;width:100%;padding:15px;border-radius:var(--r-s);
  font-size:16px;font-weight:700;text-align:center}
.btn-p{background:var(--forest);color:var(--white)}
.btn-p:active{background:var(--forest-d)}
.btn-g{background:var(--lime);color:var(--forest-d)}
.btn-o{background:var(--white);color:var(--forest);border:1.5px solid var(--forest)}
.btn-sm{width:auto;padding:8px 14px;font-size:13px;border-radius:7px}
.btn[disabled]{opacity:.5}

/* ---------- fasce discrete (elemento firma) ---------- */
.fasce{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.fascia{padding:13px 2px;border-radius:var(--r-s);border:1.5px solid var(--line);
  background:var(--white);font-weight:700;font-size:13px;text-align:center;
  color:var(--mut);transition:all .12s}
.fascia small{display:block;font-weight:500;font-size:10px;margin-top:1px}
.fascia.on{background:var(--forest);border-color:var(--forest);color:var(--white)}
.fascia.zero.on{background:var(--mut);border-color:var(--mut)}

/* ---------- liste dinamiche ---------- */
.dyn{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.dyn-row{display:grid;gap:8px;margin-bottom:10px;align-items:end}
.x{background:none;color:var(--red);font-size:20px;font-weight:800;padding:0 8px}
.add{background:none;color:var(--moss);font-weight:700;font-size:14px;padding:6px 0}

/* ---------- checkbox grandi (macchine) ---------- */
.chip{display:flex;align-items:center;gap:8px;padding:10px;border:1.5px solid var(--line);
  border-radius:var(--r-s);background:var(--white);font-size:14px;font-weight:600}
.chip input{width:22px;height:22px;accent-color:var(--forest)}
.chip.gold input{accent-color:var(--gold)}

/* ---------- tab bar ---------- */
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--white);
  border-top:1px solid var(--line);display:flex;z-index:60}
.tab{flex:1;padding:10px 4px 12px;text-align:center;font-size:11px;font-weight:700;
  color:var(--mut);background:none;text-transform:uppercase;letter-spacing:.03em}
.tab .ic{display:block;font-size:20px;margin-bottom:2px}
.tab.on{color:var(--forest)}
.tab.on .ic{transform:scale(1.1)}

/* ---------- viste / dashboard ---------- */
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.kpi .k{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .k b{font-size:22px;color:var(--forest);display:block}
.kpi .k span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--moss);border-radius:5px}
.bar i.over{background:var(--red)}
.att-row{padding:12px 0;border-bottom:1px solid var(--line)}
.att-row:last-child{border:none}
.att-row .t{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.att-row .s{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.pill{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px}
.pill.ok{background:var(--lime);color:var(--forest-d)}
.pill.late{background:#FDEBD0;color:#9A6B1F}
.pill.bad{background:#FADBD8;color:var(--red)}
table.grid{width:100%;border-collapse:collapse;font-size:12px}
table.grid th{background:var(--forest);color:var(--white);padding:7px 5px;text-align:right;font-weight:700}
table.grid th:first-child{text-align:left}
table.grid td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:right}
table.grid td:first-child{text-align:left;font-weight:600}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- login ---------- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--forest) 0%,var(--forest-d) 100%);padding:20px}
.login .box{background:var(--white);border-radius:16px;padding:28px 24px;width:100%;max-width:380px}
.login .logo{text-align:center;margin-bottom:22px}
.login .logo b{font-size:24px;color:var(--forest);letter-spacing:.01em}
.login .logo span{display:block;font-size:11px;color:var(--mut);
  text-transform:uppercase;letter-spacing:.14em;margin-top:2px}
.err{background:#FADBD8;color:var(--red);padding:10px;border-radius:var(--r-s);
  font-size:13px;margin-bottom:12px;display:none}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);
  background:var(--forest-d);color:var(--white);padding:12px 22px;border-radius:99px;
  font-weight:700;font-size:14px;z-index:99;box-shadow:0 4px 16px rgba(0,0,0,.25);
  opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.hide{display:none!important}
.banner{background:var(--gold);color:#5B3D0E;padding:10px 14px;border-radius:var(--r-s);
  font-size:13px;font-weight:600;margin-bottom:14px}
.sitobar{position:sticky;top:56px;z-index:40;background:var(--lime);
  display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:2px solid var(--moss)}
.sitobar .sb-l{font-size:12px;font-weight:700;color:var(--forest-d);text-transform:uppercase;letter-spacing:.04em}
.sitobar .sb-site{font-size:18px;font-weight:800;color:var(--forest-d)}
.sitobar select{font-size:17px;font-weight:800;color:var(--forest-d);background:var(--white);
  border:1.5px solid var(--moss);padding:8px 10px;width:auto;flex:1;max-width:340px}
.cat-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.int-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;border-top:1px solid var(--line)}
.cost-r{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px solid var(--line)}
.cost-tot{font-size:16px;font-weight:800;color:var(--forest);border-bottom:none;border-top:2px solid var(--forest);margin-top:4px;padding-top:8px}
.scad-row{padding:10px 0;border-bottom:1px solid #EEF1EA}
.scad-row:last-of-type{border-bottom:none}
.scad-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.scad-nome{font-weight:700;font-size:14px}
.scad-badge{color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:10px;white-space:nowrap;text-transform:uppercase;letter-spacing:.02em}
.scad-meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut);margin:3px 0 6px}
.scad-bar{position:relative;height:10px;background:var(--line);border-radius:5px;overflow:visible}
.scad-fill{display:block;height:100%;background:var(--moss);border-radius:5px}
.scad-today{position:absolute;top:-3px;width:2px;height:16px;background:var(--ink);border-radius:1px}
.scad-today::after{content:"oggi";position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--ink);font-weight:700}
.rit-note{font-size:12px;color:#9A3B2C;margin-top:5px}
.rit-fm{color:#B8841F}
.fm-list{margin-top:4px}
.fm-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0;font-size:12px}
.fm-rev{opacity:.55;text-decoration:line-through}
.rev-btn{border:1px solid #B8841F;color:#B8841F;background:#fff;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;white-space:nowrap;text-decoration:none}
.scad-sco{font-size:12px;margin-top:5px}
.sco{font-weight:600}
.sco-bad{color:#C0392B}
.sco-ok{color:#2E7D32}
.banner-alert{background:#FBE9E5;border-left:4px solid #C0392B;color:#7A2418;font-weight:600}
.cat-block{margin:14px 0}
.cat-h{font-size:13px;font-weight:800;color:var(--forest);text-transform:uppercase;letter-spacing:.03em;
  border-bottom:2px solid var(--lime);padding-bottom:5px;margin:0 0 10px}
.int-block{margin:0 0 14px;padding-left:10px;border-left:3px solid #E3E7DD}
.int-t{font-weight:700;font-size:14px;color:var(--ink);margin-bottom:7px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sv-av{margin:0 0 10px}
.sv-av>label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.cp-piante{font-size:16px}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin:6px 0;cursor:pointer}
.chk input{width:18px;height:18px}
.chk2{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mut)}
.chk2 input{width:16px;height:16px}
.int-head{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.int-head input{width:18px;height:18px}
.tag{font-size:10px;font-weight:800;background:var(--gold);color:#fff;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.03em}
.int-card{border:1px solid #E3E7DD}
.sv-list{margin:6px 0}
.effgrid{display:grid;gap:7px;min-width:560px}
.effgrid .eh{font-size:10.5px;font-weight:800;color:var(--mut);text-transform:uppercase;
  letter-spacing:.02em;text-align:center;align-self:end;padding-bottom:3px;line-height:1.15}
.effgrid .es{font-size:12.5px;font-weight:700;color:var(--ink);display:flex;align-items:center}
.effgrid .tile{border-radius:10px;padding:9px 4px;text-align:center;color:#fff}
.effgrid .tile b{font-size:17px;font-weight:800;display:block;line-height:1}
.effgrid .tile span{font-size:9.5px;opacity:.9;display:block;margin-top:2px}
.effgrid .tile.nd{background:#E6E8E1!important;color:var(--mut)}
.efflegend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11.5px;color:var(--mut)}
.efflegend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.modal{position:fixed;inset:0;background:rgba(20,30,18,.55);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:24px}
.modal-box{background:var(--white);border-radius:14px;padding:22px;max-width:380px;width:100%}
.modal-body{font-size:17px;color:var(--ink);line-height:1.5;margin-bottom:18px}
.modal-body b{color:var(--forest)}
.modal-act{display:flex;gap:10px}
.modal-act .btn{flex:1}
.flag-r{display:inline-block;font-size:12px;font-weight:800;background:#FADBD8;color:#C0392B;
  padding:2px 7px;border-radius:10px;margin-left:6px;white-space:nowrap}
.flag-y{display:inline-block;font-size:12px;font-weight:800;background:#FCF3CF;color:#9A6B1F;
  padding:2px 7px;border-radius:10px;margin-left:6px;white-space:nowrap}
.int-card.has-r{border-left:4px solid #C0392B}
.int-card.has-y{border-left:4px solid #E8A33D}
.int-card.annull{opacity:.5}
.int-card.annull .int-head b{text-decoration:line-through}
.miss{font-size:11.5px;color:#9A6B1F;margin-top:6px}
.miss b{color:#7A5310}
.switch{display:flex;gap:0;border:1.5px solid var(--forest);border-radius:var(--r-s);overflow:hidden;margin-bottom:12px}
.switch button{flex:1;padding:10px 6px;font-size:13px;font-weight:700;background:var(--white);color:var(--forest)}
.switch button.on{background:var(--forest);color:var(--white)}
.lotto-tag{font-size:10px;font-weight:800;background:#E3E7DD;color:var(--forest-d);padding:2px 7px;
  border-radius:10px;text-transform:uppercase;letter-spacing:.03em}
.lotto-tag.urg{background:#C0392B;color:#fff}
@media(min-width:700px){.fascia{font-size:14px}.dyn-row{gap:10px}}
</style>
</head>
<body>

<!-- ======================= LOGIN ======================= -->
<div id="v-login" class="login">
  <div class="box">
    <div class="logo"><b>HALAESA</b><span>Controllo Operazioni Straordinarie</span></div>
    <div class="err" id="login-err"></div>
    <div class="field"><label>Email</label><input type="email" id="l-email" autocomplete="username"></div>
    <div class="field"><label>Password</label><input type="password" id="l-pass" autocomplete="current-password"></div>
    <button class="btn btn-p" id="l-go">Entra</button>
    <p class="muted" style="text-align:center;margin-top:14px">Accesso riservato. Per credenziali contattare la direzione.</p>
  </div>
</div>

<!-- ======================= APP ======================= -->
<div id="v-app" class="hide">
  <div class="hdr">
    <div class="brand">HALAESA<small>Controllo OS</small></div>
    <div class="who"><b id="who-nome"></b><span id="who-ruolo"></span> · <a href="#" id="logout" style="color:var(--lime)">esci</a></div>
  </div>
  <div id="sitobar" class="sitobar hide"></div>
  <div class="wrap">
    <div id="pane-compila"></div>
    <div id="pane-gasolio" class="hide"></div>
    <div id="pane-sito" class="hide"></div>
    <div id="pane-dash" class="hide"></div>
    <div id="pane-setup" class="hide"></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div>
<div class="toast" id="toast"></div>
<div id="modal" class="modal hide"><div class="modal-box">
  <div class="modal-body"></div>
  <div class="modal-act"><button class="btn btn-o" id="m-no">Annulla</button><button class="btn btn-p" id="m-ok">Conferma</button></div>
</div></div>

<script>
/* Le chiavi vivono in config.js (caricato una volta, mai più toccato). */
const sb = supabase.createClient(window.HALAESA_CONFIG.url, window.HALAESA_CONFIG.key);
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = t => String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur = n => (n??0).toLocaleString("it-IT",{maximumFractionDigits:0})+" €";
const oggi = () => new Date().toISOString().slice(0,10);
let P = null;          // profilo: {id,nome,ruolo,super_user,sito_id,email}
const isSuper = () => !!P?.super_user;
const isReadOnly = () => !!P?.sola_lettura;
let DB = {};           // anagrafiche in cache: siti, attivita, operai, macchine, terzisti
const FASCE = [25,50,75,100];

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}
function err(sel,m){const e=$(sel);e.textContent=m;e.style.display="block"}

/* ---------------- AUTH ---------------- */
$("#l-go").onclick = async () => {
  $("#login-err").style.display="none";
  const {error} = await sb.auth.signInWithPassword({email:$("#l-email").value.trim(),password:$("#l-pass").value});
  if(error){err("#login-err","Credenziali non valide.");return}
  start();
};
$("#logout").onclick = async e => {e.preventDefault(); await sb.auth.signOut(); location.reload()};

async function start(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){$("#v-login").classList.remove("hide");$("#v-app").classList.add("hide");return}
  const {data:prof} = await sb.from("profili").select("*").eq("id",session.user.id).single();
  if(!prof){err("#login-err","Utente senza profilo: contattare la direzione.");await sb.auth.signOut();return}
  P = prof;
  // anagrafiche + lista master della gerarchia (categorie/interventi)
  const [si,ca,inv,op,ma,pa,cr,pz] = await Promise.all([
    sb.from("siti").select("*").order("id"),
    sb.from("categorie").select("*").order("ordine"),
    sb.from("interventi").select("*").order("ordine"),
    sb.from("operai").select("*").eq("attivo",true).order("nome"),
    sb.from("macchine").select("*").eq("attivo",true).order("nome"),
    sb.from("parametri").select("*"),
    sb.from("causali_ritardo").select("*").order("ordine"),
    sb.from("categorie_perizia").select("*").order("ordine"),
  ]);
  DB = {siti:si.data||[], categorie:ca.data||[], interventi:inv.data||[],
        operai:op.data||[], macchine:ma.data||[], causali:cr.data||[], perizie:pz.data||[],
        par:Object.fromEntries((pa.data||[]).map(p=>[p.chiave,+p.valore]))};
  $("#v-login").classList.add("hide");$("#v-app").classList.remove("hide");
  $("#who-nome").textContent = P.nome;
  const sitoNome = DB.siti.find(s=>s.id===P.sito_id)?.nome || "Tutti i siti";
  $("#who-ruolo").textContent = P.ruolo + " · " + sitoNome;
  buildTabs(); show((isSuper()||isReadOnly()) ? "dash" : "compila");
}

/* ---------------- TABS / ROUTING ---------------- */
const TABS = {
  compila:{ic:"📝",l:"Compila",who:p=>!isReadOnly()},
  gasolio:{ic:"⛽",l:"Gasolio",who:p=>!isReadOnly()},
  sito:{ic:"📍",l:"Il mio sito",who:p=>!isReadOnly()&&!isSuper()&&p.sito_id},
  dash:{ic:"📊",l:"Dashboard",who:p=>isSuper()||isReadOnly()},
  setup:{ic:"⚙️",l:"Setup",who:p=>isSuper()&&!isReadOnly()},
};
function buildTabs(){
  $("#tabs").innerHTML = Object.entries(TABS)
    .filter(([k,t])=>t.who(P))
    .map(([k,t])=>`<button class="tab" data-t="${k}"><span class="ic">${t.ic}</span>${t.l}</button>`).join("");
  $$(".tab").forEach(b=>b.onclick=()=>show(b.dataset.t));
}
function show(k){
  CURRENT_TAB=k;
  $$(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===k));
  ["compila","gasolio","sito","dash","setup"].forEach(p=>$("#pane-"+p).classList.toggle("hide",p!==k));
  renderSitoBar(k==="compila"||k==="gasolio");
  ({compila:rCompila,gasolio:rGasolio,sito:rSito,dash:rDash,setup:rSetup})[k]();
}

/* ---------------- MOTORE COSTI (logica validata) ----------------
   - % discreta: ultimo valore (limite alto fascia)
   - Piantumazione: piante cumulative (ultimo valore) / previste
   - materiali = Σ importi attività × frazione avanzamento
   - ore uomo = ore × tariffa; macchine = presenza × tariffa/g
   - gasolio = litri × prezzo sito; terzisti = ore × tariffa
   - ha completati = ettari_totali × Σ(peso × %)/10000           */
/* ---------------- DATI PER SITO + MOTORE COSTI GERARCHICO (Blocco 2) ---------------- */
async function datiSito(sito_id){
  const q = t => sb.from(t).select("*").eq("sito_id",sito_id);
  const [si_int, sc, av, ap, ou, mg, ga, ri] = await Promise.all([
    q("sito_interventi"), q("sito_categorie"),
    q("avanzamenti"), q("avanz_piante"), q("ore_uomo"),
    q("macchine_giorno"), q("gasolio"), q("ritardi"),
  ]);
  const siIds = (si_int.data||[]).map(x=>x.id);
  let sv = [];
  if(siIds.length){
    const r = await sb.from("sottovoci").select("*").in("sito_intervento_id",siIds).order("ordine");
    sv = r.data||[];
  }
  return {sito_interventi:si_int.data||[], sito_categorie:sc.data||[], sottovoci:sv,
          avanzamenti:av.data||[], avanz_piante:ap.data||[], ore_uomo:ou.data||[],
          macchine_giorno:mg.data||[], gasolio:ga.data||[], ritardi:ri.data||[]};
}
const MAXV = arr => arr.length ? Math.max(...arr) : 0;
/* ---- dati mancanti (cartello giallo) e bandierina rossa ---- */
const VUOTO = v => v===null || v===undefined || v==="";
function mancanti(si, intv){
  if(si.annullato) return [];
  const m=[];
  if(intv.tipo==="piante"){
    if(VUOTO(si.piante_previste)) m.push("piante previste");
    if(VUOTO(si.costo_unitario))  m.push("costo per pianta");
  } else {
    if(VUOTO(si.budget)) m.push("budget");
    if(VUOTO(si.costo_unitario_voce)) m.push("costo unitario");
  }
  if(VUOTO(si.unita_misura)) m.push("unità di misura");
  if(VUOTO(si.quantita))     m.push("quantità");
  if(si.modalita==="da_definire") m.push("modalità");
  if(VUOTO(si.scadenza))     m.push("scadenza");
  return m;
}
const budgetEffDi = (si,intv) => intv.tipo==="piante"
  ? (+si.piante_previste||0)*(+si.costo_unitario||0) : (+si.budget||0);

function calcSito(sito_id, D){
  const sito = DB.siti.find(s=>s.id===sito_id) || {};
  const prezzoGasolio = DB.par?.prezzo_gasolio || 0;
  const tariffaOp = id => (DB.operai.find(o=>o.id===id)||{}).tariffa_ora || 0;
  const tariffaMa = id => (DB.macchine.find(m=>m.id===id)||{}).tariffa_giorno || 0;
  const attivi = D.sito_interventi.filter(si=>si.attivo && !si.annullato);
  // ---- INTERVENTO ----
  const perInt = attivi.map(si=>{
    const intv = DB.interventi.find(i=>i.id===si.intervento_id) || {};
    let avz=0;
    const budgetEff = budgetEffDi(si,intv);
    if(intv.tipo==="piante"){
      const prev=+si.piante_previste||0;
      const messe=MAXV(D.avanz_piante.filter(a=>a.sito_intervento_id===si.id).map(a=>+a.piante||0));
      avz = prev>0?Math.min(messe/prev,1):0;
    } else {
      const svs=D.sottovoci.filter(sv=>sv.sito_intervento_id===si.id);
      if(svs.length){
        let sum=0;
        for(const sv of svs) sum += MAXV(D.avanzamenti.filter(a=>a.sottovoce_id===sv.id).map(a=>+a.pct||0))/100;
        avz=sum/svs.length;
      } else {
        avz = MAXV(D.avanzamenti.filter(a=>a.sito_intervento_id===si.id).map(a=>+a.pct||0))/100;
      }
    }
    const costoBudget=budgetEff*avz;
    const ore=D.ore_uomo.filter(o=>o.sito_intervento_id===si.id)
                .reduce((s,o)=>s+(+o.ore||0)*tariffaOp(o.operaio_id),0);
    return {si_id:si.id,intervento_id:si.intervento_id,categoria_id:intv.categoria_id,
            perizia_id:intv.categoria_perizia_id, lotto:si.lotto||"Intero sito",
            nome:intv.nome,modalita:si.modalita,tipo:intv.tipo,avz,budgetEff,costoBudget,ore,
            costoInt:costoBudget+ore, mancanti:mancanti(si,intv), daVerificare:!!si.da_verificare,
            nota:si.nota_verifica, priorita:si.priorita};
  });
  // ---- aggregazione generica pesata sul budget (fallback: media semplice) ----
  function aggrega(items,chiave){
    const m={};
    for(const p of items){
      const k=p[chiave]??0;
      (m[k]=m[k]||{sum:0,n:0,b:0,bs:0}).sum+=p.avz; m[k].n++;
      m[k].b+=p.budgetEff; m[k].bs+=p.budgetEff*p.avz;
    }
    return Object.entries(m).map(([k,v])=>({id:+k,
      avz: v.b>0 ? v.bs/v.b : (v.n?v.sum/v.n:0), nInt:v.n, budget:v.b}));
  }
  const perCat = aggrega(perInt,"categoria_id").map(x=>({categoria_id:x.id,...x}));
  const perPz  = aggrega(perInt,"perizia_id").map(x=>({perizia_id:x.id,...x}));
  // ---- SITO: pesato sui budget; se non ci sono budget, pesi di categoria ----
  const budTot = perInt.reduce((s,p)=>s+p.budgetEff,0);
  let avz, pesoTot=0, avzPesato=0;
  if(budTot>0){
    avz = perInt.reduce((s,p)=>s+p.budgetEff*p.avz,0)/budTot;
  } else {
    for(const c of perCat){
      const w=(D.sito_categorie.find(x=>x.categoria_id===c.categoria_id)||{}).peso_pct||0;
      avzPesato+=(w/100)*c.avz; pesoTot+=w/100;
    }
    avz = pesoTot>0?avzPesato/pesoTot:0;
  }
  const ettari=(+sito.ettari_totali||0)*avz;
  // ---- COSTI ----
  let bIn=0,bTe=0,cIn=0,cTe=0,ore=0;
  for(const p of perInt){
    if(p.modalita==="conto_terzi"){bTe+=p.budgetEff;cTe+=p.costoBudget;}
    else{bIn+=p.budgetEff;cIn+=p.costoBudget;}
    ore+=p.ore;
  }
  const macchine=D.macchine_giorno.filter(m=>m.presente).reduce((s,m)=>s+tariffaMa(m.macchina_id),0);
  const gasolio=D.gasolio.reduce((s,g)=>s+(+g.litri||0),0)*prezzoGasolio;
  const gg_fermo=D.ritardi.reduce((s,r)=>s+(+r.giorni||0),0);
  const interno=cIn+ore+macchine+gasolio, terzisti=cTe, totale=interno+terzisti, budgetTot=bIn+bTe;
  // ---- segnalazioni ----
  const nMancanti = perInt.filter(p=>p.mancanti.length).length + (VUOTO(sito.ettari_totali)?1:0);
  const nRosse    = perInt.filter(p=>p.daVerificare).length;
  const lotti     = [...new Set(D.sito_interventi.filter(x=>x.attivo&&!x.annullato).map(x=>x.lotto||"Intero sito"))];
  return {avz,avzPesato,pesoTot,ettari,perInt,perCat,perPz,gg_fermo,nMancanti,nRosse,lotti,budTot,
    ettariMancanti:VUOTO(sito.ettari_totali),
    costi:{costoMatInhouse:cIn,costoMatTerzi:cTe,ore,macchine,gasolio,interno,terzisti,totale,budgetTot,budgetInhouse:bIn,budgetTerzi:bTe}};
}

/* ---- Scadenze / gantt a scadenze ---- */
function statoScadenza(avvio, scadenza, oggiStr, avz, prorogaGiorni){
  if(avz>=1) return {stato:"completato", proroga:prorogaGiorni||0};
  if(!scadenza) return {stato:"nd"};
  const D=d=>new Date(d+"T00:00:00"), gg=(a,b)=>Math.round((D(a)-D(b))/86400000);
  const addgg=(d,n)=>{const x=D(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);};
  const P=prorogaGiorni||0;
  const scadEff = P>0 ? addgg(scadenza,P) : scadenza;
  const rim=gg(scadEff,oggiStr);
  let stato, frac=null;
  if(rim<0) stato="scaduto";
  else if(!avvio) stato="nd_tempo";
  else { const tot=gg(scadEff,avvio); frac=tot>0?rim/tot:0;
    stato = frac<=0.05?"5": frac<=0.10?"10": frac<=0.20?"20":"ok"; }
  // scostamento reale (forecast lineare): giorni oltre/sotto la scadenza rettificata
  let scostamento=null;
  if(avvio && avz>0 && avz<1){
    const elapsed=gg(oggiStr,avvio);
    if(elapsed>0){ const totForecast=elapsed/avz, totEff=gg(scadEff,avvio);
      scostamento=Math.round(totForecast-totEff); }
  }
  return {stato, rim, ritardoGiorni:rim<0?-rim:0, frac, scadEff, proroga:P, scostamento};
}
const STATI = {
  scaduto:{l:"SCADUTO",c:"#8E2820"}, "5":{l:"≤5% tempo",c:"#C0392B"},
  "10":{l:"≤10% tempo",c:"#E07B39"}, "20":{l:"≤20% tempo",c:"#E8A33D"},
  ok:{l:"in tempo",c:"#1F5C2E"}, completato:{l:"completato",c:"#8CBF66"},
  nd_tempo:{l:"manca avvio sito",c:"#6B7565"}, nd:{l:"—",c:"#9aa39a"}
};
function scadenzeSito(sitoId, D, R){
  const avvio=(DB.siti.find(s=>s.id===sitoId)||{}).data_avvio;
  const ord={scaduto:0,"5":1,"10":2,"20":3,nd_tempo:4,ok:5,completato:6,nd:7};
  const items=[];
  for(const si of D.sito_interventi.filter(x=>x.attivo)){
    const intv=DB.interventi.find(i=>i.id===si.intervento_id)||{};
    const p=R.perInt.find(x=>x.si_id===si.id)||{avz:0};
    const rit=D.ritardi.filter(r=>r.sito_intervento_id===si.id);
    const proroga=rit.filter(r=>r.forza_maggiore && !r.proroga_revocata).reduce((s,r)=>s+(+r.giorni||0),0);
    const ritFM=rit.filter(r=>r.forza_maggiore);
    const ritImput=rit.filter(r=>!r.forza_maggiore);
    const st=statoScadenza(avvio, si.scadenza, oggi(), p.avz, proroga);
    items.push(Object.assign({nome:intv.nome, categoria:catNome(intv.categoria_id), avz:p.avz,
      scadenza:si.scadenza, ritardi:rit, ritFM, ritImput}, st));
  }
  items.sort((a,b)=>(ord[a.stato]-ord[b.stato])||((a.rim??1e9)-(b.rim??1e9)));
  return items;
}

    const ritFM=i.ritFM||[];

    if(ritFM.length){

      ritHtml+=`<div class="rit-note">⚠ Ritardo imputabile: ${g} gg${cs?` — ${esc(cs)}`:''}</div>`; }
    return `<div class="scad-row">

        <span>Avanz. ${Math.round(i.avz*100)}% · scad. ${i.scadenza?dIt(i.scadenza):"—"}${pror}${tempo?" · "+tempo:""}</span></div>
      <div class="scad-bar"><i class="scad-fill" style="width:${Math.round(i.avz*100)}%"></i>
        ${(i.frac!=null||i.stato==="scaduto")?`<span class="scad-today" style="left:${Math.round(elapsed*100)}%"></span>`:''}</div>
      ${scoTxt?`<div class="scad-sco">${scoTxt}</div>`:''}
      ${ritHtml}</div>`;
  }).join("");
  const banner=allarmi?`<div class="banner banner-alert">⏰ ${allarmi} ${allarmi===1?"intervento richiede attenzione sulle scadenze":"interventi richiedono attenzione sulle scadenze"}</div>`:'';
  return `<div class="card"><h2>${titolo}</h2>${banner}${rows}
    <p class="muted" style="font-size:11.5px;margin-top:8px">Barra = avanzamento; segno verticale = "oggi" sulla finestra avvio→scadenza (rettificata con le proroghe). Lo scostamento reale stima la fine al ritmo attuale.</p></div>`;

  const budTotAll = budCol.reduce((s2,x)=>s2+x.budget,0);

  const colScala=(v,lo,hi,inv)=>{if(v==null||!isFinite(v))return null;let t=(v-lo)/((hi-lo)||1);t=Math.min(Math.max(t,0),1);if(inv)t=1-t;return t>=0.75?C.ott:t>=0.5?C.buono:t>=0.25?C.att:C.crit;};

     <div class="k"><b>${eur(T.terzisti)}</b><span>di cui conto terzi</span></div>

     <div class="k"><b>${eur(T.budget)}</b><span>Budget materiali/preventivi</span></div>
   </div>
   ${segnalazioni(all)}
   <div class="switch">
     <button class="${VISTA==="categorie"?"on":""}" onclick="setVista('categorie')">Per lavorazione</button>
     <button class="${VISTA==="perizia"?"on":""}" onclick="setVista('perizia')">Per categoria perizia</button>
   </div>
   <div class="card"><h2>Budget e avanzamento — ${VISTA==="perizia"?"categorie perizia":"categorie di lavorazione"}</h2>
     <div class="scroll-x">${tabBud}</div>
     <p class="muted" style="margin-top:8px">Gli avanzamenti sono pesati sui budget: una voce da 300.000 € conta più di una da 3.000 €.</p></div>
   ${renderScadenze(scadAll,"Scadenze portfolio (gantt a scadenze)",true,!isReadOnly())}
   <div class="card"><h2>Consolidamento 7 siti</h2><div class="scroll-x">

   </div><p class="muted" style="margin-top:8px">Il totale include ore/macchine/gasolio; il budget è solo materiali e preventivi.</p></div>
   <div class="card"><h2>Heatmap avanzamento (sito × ${VISTA==="perizia"?"categoria perizia":"categoria"})</h2><div class="scroll-x">${heat}</div></div>
   <div class="card"><h2>Efficienza dei siti a confronto</h2>
     <p class="muted" style="margin-bottom:12px">Indicatori confrontabili tra siti. Verde = buono, rosso = critico. €/ha e giorni fermo: colore relativo al portfolio (più basso = meglio).</p>

     <div class="efflegend"><span><span class="sw" style="background:#1F5C2E"></span>ottimo</span><span><span class="sw" style="background:#8CBF66"></span>buono</span><span><span class="sw" style="background:#E8A33D"></span>attenzione</span><span><span class="sw" style="background:#C0392B"></span>critico</span><span><span class="sw" style="background:#E6E8E1"></span>n/d</span></div>
   </div>
   ${isReadOnly()?"":`<div class="card"><h2>Esporta dati (CSV)</h2><div class="row2">
     ${["categorie","categorie_perizia","interventi","sito_interventi","sottovoci","sito_categorie","avanzamenti","avanz_piante","ore_uomo","macchine_giorno","gasolio","ritardi"].map(t=>`<button class="btn btn-o btn-sm" data-csv="${t}" style="margin-bottom:8px">${t.replace(/_/g," ")}</button>`).join("")}
     <button class="btn btn-g btn-sm" id="csv-consol" style="margin-bottom:8px">consolidamento interventi</button></div></div>`}`;

      p.daVerificare?"SI":"", p.mancanti.join("; ")
    ].map(v=>`"${String(v).replace(/"/g,'""')}"`))));
    dlCsv("consolidamento_interventi.csv",rows.map(r=>r.join(",")).join("\n"));

}
async function exportCsv(table){
  const {data}=await sb.from(table).select("*");
  if(!data||!data.length)return toast("Nessun dato da esportare");
  const cols=Object.keys(data[0]);
  const csv=[cols.join(","),...data.map(r=>cols.map(c=>JSON.stringify(r[c]??"")).join(","))].join("\n");
  dlCsv(table+".csv",csv);
}
function dlCsv(name,content){
  const blob=new Blob([content],{type:"text/csv"});const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;a.click();
}

async function inviaCompilazione(){
  $("#c-err").style.display="none";
  const sito=CC.sito, data=$("#c-data").value, comp=$("#c-comp").value.trim()||P.nome;
  if(!data) return err("#c-err","Indica la data.");
  const ouZero=$("#c-ou-zero").checked, mgZero=$("#c-mg-zero").checked;
  const ouRows=$$("#c-ou-list .dyn-row");
  if(!ouZero && ouRows.length===0) return err("#c-err","Aggiungi le ore personale o spunta «Nessuna ora personale oggi».");
  const mgPres=$$("#c-mg-list .mg-pres").some(c=>c.checked);
  if(!mgZero && !mgPres) return err("#c-err","Indica le macchine presenti o spunta «Nessuna macchina presente oggi».");
  if(!await confermaSito(sito,data)) return;
  await sb.from("compilazioni").upsert({sito_id:sito,data,compilatore:comp},{onConflict:"sito_id,data"});
  for(const r of $$("#pane-compila .sv-av")){
    const on=r.querySelector(".fascia.on"); const pct=+(on?on.dataset.v:0)||0;
    if(pct<=0) continue;
    if(r.dataset.svid) await sb.from("avanzamenti").insert({sito_id:sito,sottovoce_id:+r.dataset.svid,data,compilatore:comp,pct});
    else if(r.dataset.iav) await sb.from("avanzamenti").insert({sito_id:sito,sito_intervento_id:+r.dataset.iav,data,compilatore:comp,pct});
  }
  for(const r of $$("#pane-compila [data-piante]")){
    const v=+r.querySelector(".cp-piante").value||0;
    if(v>0) await sb.from("avanz_piante").insert({sito_id:sito,sito_intervento_id:+r.dataset.piante,data,compilatore:comp,piante:v});
  }
  if(!ouZero) for(const r of ouRows){
    const si=+r.querySelector(".ou-int").value, op=+r.querySelector(".ou-op").value, ore=+r.querySelector(".ou-ore").value||0;
    if(ore>0) await sb.from("ore_uomo").insert({sito_id:sito,sito_intervento_id:si,operaio_id:op,data,ore});
  }
  if(!mgZero) for(const r of $$("#c-mg-list .mg-row")){
    if(r.querySelector(".mg-pres").checked)
      await sb.from("macchine_giorno").insert({sito_id:sito,macchina_id:+r.dataset.ma,data,presente:true,usata:r.querySelector(".mg-usata").checked});
  }
  for(const r of $$("#c-ri-list .dyn-row")){
    const gg=+r.querySelector(".ri-gg").value||0; if(gg<=0)continue;
    const si=r.querySelector(".ri-int").value;
    const cid=+r.querySelector(".ri-causa").value||0;
    const caus=DB.causali.find(c=>c.id===cid);
    await sb.from("ritardi").insert({sito_id:sito,sito_intervento_id:si?+si:null,data,giorni:gg,
      causa:caus?caus.nome:null, forza_maggiore:caus?!!caus.forza_maggiore:false});
  }
  toast("Compilazione inviata ✓"); rCompila();
}

    $("#g-err").style.display="none";
    const litri=+$("#g-litri").value||0;
    if(litri<=0)return err("#g-err","Inserisci i litri, oppure usa «Nessun rifornimento oggi».");
    if(!await confermaSito(gsito(),$("#g-data").value)) return;
    const {error}=await sb.from("gasolio").insert({sito_id:gsito(),data:$("#g-data").value,litri,operatore:$("#g-op").value.trim()||P.nome});
    if(error)return toast("Errore di salvataggio");toast("Rifornimento registrato ✓");$("#g-litri").value="";
  };
}


/* ====================== SETUP (Blocco 3) ====================== */
async function rSetup(){
  $("#pane-setup").innerHTML = `
  <div class="card"><h2>⚙️ Setup</h2>
    <div class="row2">
      <button class="btn btn-o btn-sm" data-s="siti">Siti e parametri</button>
      <button class="btn btn-o btn-sm" data-s="operai">Operai</button>

  <div id="setup-body"></div>`;

function svRow(id,nome){
  return `<div class="sv-row dyn-row" style="grid-template-columns:1fr auto" data-svid="${id||""}">
    <input class="sv-nome" value="${esc(nome||"")}" placeholder="es. Accesso nord">
    <button class="x sv-del">×</button></div>`;
}

const SETUP = {
 /* ---- Siti e parametri ---- */
 async siti(){
  const {data}= await sb.from("siti").select("*").order("id");
  $("#setup-body").innerHTML=`<div class="card"><h2>Parametri aziendali</h2>
   <div class="field"><label>Prezzo gasolio €/litro (unico per tutta l'azienda)</label>

   ${data.map(s=>`<div class="dyn-row" style="grid-template-columns:1.2fr .7fr 1fr" data-id="${s.id}">
     <b style="align-self:center">${esc(s.nome)}</b>

  $("#par-save").onclick=async()=>{

  $("#s-save").onclick=async()=>{
    for(const r of $$("#setup-body [data-id]"))
      await sb.from("siti").update({ettari_totali:r.querySelector(".s-ha").value===""?null:+r.querySelector(".s-ha").value,data_avvio:r.querySelector(".s-avvio").value||null}).eq("id",+r.dataset.id);
    toast("Siti salvati ✓");DB.siti=(await sb.from("siti").select("*").order("id")).data||DB.siti;
  };
 },
 async operai(){ anag("operai","Operai",[["nome","Nome",null],["tariffa_ora","€/ora","number"]]) },
 async macchine(){ anag("macchine","Macchine — elenco unico aziendale",[["nome","Nome",null],["tariffa_giorno","€/giorno","number"]]) },

 /* ---- Interventi e sotto-voci (cuore della gerarchia) ---- */
 async interventi(){
  const sid=+($("#i-sito")?.value||DB.siti[0].id);
  const cat=+($("#i-cat")?.value||DB.categorie[0].id);
  const flt=$("#i-lotto")?.value||"";
  const {data:siAll}=await sb.from("sito_interventi").select("*").eq("sito_id",sid);
  const siIds=(siAll||[]).map(x=>x.id);
  let svAll=[];
  if(siIds.length){const r=await sb.from("sottovoci").select("*").in("sito_intervento_id",siIds).order("ordine");svAll=r.data||[];}
  const lotti=[...new Set((siAll||[]).map(x=>x.lotto||"Intero sito"))].sort();
  const righe=(siAll||[]).filter(x=>{
    const iv=DB.interventi.find(i=>i.id===x.intervento_id);
    return iv && iv.categoria_id===cat && (!flt || (x.lotto||"Intero sito")===flt);
  }).sort((x,y)=>(x.lotto||"").localeCompare(y.lotto||"")||x.intervento_id-y.intervento_id);
  const V = v => (v===null||v===undefined)?"":v;
  const cards=righe.map(si=>{
    const intv=DB.interventi.find(i=>i.id===si.intervento_id)||{};
    const isP=intv.tipo==="piante", attivo=!!si.attivo, ann=!!si.annullato;
    const miss=mancanti(si,intv);
    const svs=svAll.filter(x=>x.sito_intervento_id===si.id);
    const lot=si.lotto||"Intero sito";
    const cls=[ann?"annull":"", si.da_verificare?"has-r":(miss.length?"has-y":"")].join(" ");
    return `<div class="card int-card ${cls}" data-si="${si.id}" data-int="${intv.id}" style="padding:12px">
      <label class="int-head"><input type="checkbox" class="i-attivo" ${attivo?"checked":""} ${ann?"disabled":""}>
        <b>${esc(intv.nome)}</b>
        <span class="lotto-tag ${lot!=="Intero sito"?"urg":""}">${esc(lot)}</span>
        ${isP?'<span class="tag">piante</span>':''}
        ${si.da_verificare?'<span class="flag-r">🚩 da verificare</span>':''}
        ${(!ann&&miss.length)?`<span class="flag-y">⚠️ ${miss.length} da inserire</span>`:''}
        ${ann?'<span class="flag-r">annullata</span>':''}</label>
      ${si.nota_verifica?`<p class="miss" style="color:#C0392B">${esc(si.nota_verifica)}</p>`:''}
      ${(!ann&&miss.length)?`<p class="miss">Da inserire: <b>${miss.join(", ")}</b></p>`:''}
      <div class="i-body ${attivo&&!ann?"":"hide"}">
        <div class="row2" style="margin-top:8px">
          <div><label>Lotto / perimetro</label><input class="i-lot" value="${esc(lot)}"></div>
          <div><label>Modalità</label><select class="i-mod">
            <option value="da_definire" ${si.modalita==="da_definire"?"selected":""}>— da definire —</option>
            <option value="in_house" ${si.modalita==="in_house"?"selected":""}>In house</option>
            <option value="conto_terzi" ${si.modalita==="conto_terzi"?"selected":""}>Conto terzi (terzista)</option></select></div>
          <div><label>Unità di misura</label><input class="i-um" value="${esc(V(si.unita_misura))}" placeholder="ha, ml, mq, cad…"></div>
          <div><label>Quantità</label><input type="number" step="0.01" class="i-qt" value="${V(si.quantita)}"></div>
          ${isP
            ? `<div><label>Piante previste</label><input type="number" class="i-pp" value="${V(si.piante_previste)}"></div>
               <div><label>Costo €/pianta</label><input type="number" step="0.01" class="i-cu" value="${V(si.costo_unitario)}"></div>`
            : `<div><label>Costo unitario €</label><input type="number" step="0.01" class="i-cuv" value="${V(si.costo_unitario_voce)}"></div>
               <div><label>Budget €</label><input type="number" step="0.01" class="i-bud" value="${V(si.budget)}"></div>`}
          <div><label>Priorità</label><select class="i-pri">
            ${["Alta","Media","Bassa"].map(p=>`<option ${si.priorita===p?"selected":""}>${p}</option>`).join("")}</select></div>
          <div><label>Scadenza</label><input type="date" class="i-scad" value="${V(si.scadenza)}"></div>
        </div>
        ${isP?"":`<div style="margin-top:10px">
          <label class="muted">Sotto-voci</label>
          <div class="sv-list">${svs.map(x=>svRow(x.id,x.nome)).join("")}</div>
          <button class="add sv-add">+ Aggiungi sotto-voce</button></div>`}
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="btn btn-o btn-sm i-ann">${ann?"Ripristina lavorazione":"Cancella lavorazione"}</button>
        ${si.da_verificare?'<button class="btn btn-o btn-sm i-risolvi">Risolvi 🚩</button>':''}
      </div></div>`;
  }).join("");
  const addOpts=DB.interventi.filter(i=>i.categoria_id===cat)
    .map(i=>`<option value="${i.id}">${esc(i.nome)}</option>`).join("");
  $("#setup-body").innerHTML=`<div class="card"><h2>Interventi e sotto-voci</h2>
    <div class="row2">
      <div><label>Sito</label><select id="i-sito">${DB.siti.map(x=>`<option value="${x.id}" ${x.id===sid?"selected":""}>${esc(x.nome)}</option>`).join("")}</select></div>
      <div><label>Categoria</label><select id="i-cat">${DB.categorie.map(c=>`<option value="${c.id}" ${c.id===cat?"selected":""}>${esc(c.nome)}</option>`).join("")}</select></div>
      <div><label>Lotto</label><select id="i-lotto"><option value="">— tutti —</option>
        ${lotti.map(l=>`<option ${flt===l?"selected":""}>${esc(l)}</option>`).join("")}</select></div>
    </div>
    <p class="muted">🚩 = cifre da verificare · ⚠️ = dati ancora da inserire. Il cartello giallo sparisce quando tutti i campi sono compilati (anche con 0) oppure la lavorazione è cancellata.</p></div>
    ${cards||'<div class="card"><p class="muted">Nessun intervento attivato in questa categoria per questo sito.</p></div>'}
    <div class="card"><h2>Aggiungi lavorazione</h2>
      <div class="row2">
        <div><label>Intervento</label><select id="add-int">${addOpts}</select></div>
        <div><label>Lotto</label><input id="add-lot" value="Intero sito"></div>
      </div>
      <button class="btn btn-g btn-sm" id="add-go" style="margin-top:10px">+ Aggiungi al sito</button></div>
    <button class="btn btn-p" id="i-save">Salva categoria</button>`;
  $("#i-sito").onchange=()=>SETUP.interventi();
  $("#i-cat").onchange=()=>SETUP.interventi();
  $("#i-lotto").onchange=()=>SETUP.interventi();
  $$(".i-attivo").forEach(ch=>ch.onchange=()=>ch.closest(".int-card").querySelector(".i-body").classList.toggle("hide",!ch.checked));
  // budget = quantità x costo unitario (auto, sovrascrivibile)
  $$(".int-card").forEach(card=>{
    const qt=card.querySelector(".i-qt"), cu=card.querySelector(".i-cuv"), bd=card.querySelector(".i-bud");
    if(qt&&cu&&bd){ const calc=()=>{ if(qt.value!==""&&cu.value!=="") bd.value=(+qt.value*+cu.value).toFixed(2); };
      qt.oninput=calc; cu.oninput=calc; }
  });
  function bindDel(){$$(".sv-del").forEach(x=>x.onclick=()=>x.closest(".sv-row").remove());}
  $$(".sv-add").forEach(b=>b.onclick=()=>{b.previousElementSibling.insertAdjacentHTML("beforeend",svRow("",""));bindDel();});
  bindDel();
  $$(".i-ann").forEach(b=>b.onclick=async()=>{
    const card=b.closest(".int-card"), id=+card.dataset.si;
    const era=card.classList.contains("annull");
    if(!era && !await confermaTesto("Cancellare questa lavorazione? Esce dai conti e dagli avvisi, ma resta tracciata nel registro.")) return;
    const {error}=await sb.from("sito_interventi").update({annullato:!era, attivo:era?true:false}).eq("id",id);
    if(error) return toast("Errore");
    toast(era?"Lavorazione ripristinata ✓":"Lavorazione cancellata ✓"); SETUP.interventi();
  });
  $$(".i-risolvi").forEach(b=>b.onclick=async()=>{
    const id=+b.closest(".int-card").dataset.si;
    const {error}=await sb.from("sito_interventi").update({da_verificare:false}).eq("id",id);
    if(error) return toast("Errore"); toast("Segnalazione risolta ✓"); SETUP.interventi();
  });
  $("#add-go").onclick=async()=>{
    const rec={sito_id:sid,intervento_id:+$("#add-int").value,lotto:$("#add-lot").value.trim()||"Intero sito",attivo:true};
    const {error}=await sb.from("sito_interventi").insert(rec);
    if(error) return toast(error.code==="23505"?"Già presente su questo lotto":"Errore");
    toast("Lavorazione aggiunta ✓"); SETUP.interventi();
  };
  $("#i-save").onclick=async()=>{
    const N=el=>{ if(!el) return null; return el.value===""?null:+el.value; };
    for(const card of $$(".int-card")){
      if(card.classList.contains("annull")) continue;
      const id=+card.dataset.si, intv=DB.interventi.find(i=>i.id===+card.dataset.int);
      const g=c=>card.querySelector(c);
      const rec={attivo:g(".i-attivo").checked, lotto:g(".i-lot").value.trim()||"Intero sito",
        modalita:g(".i-mod").value, unita_misura:g(".i-um").value.trim()||null,
        quantita:N(g(".i-qt")), priorita:g(".i-pri").value, scadenza:g(".i-scad").value||null};
      if(intv.tipo==="piante"){ rec.piante_previste=N(g(".i-pp")); rec.costo_unitario=N(g(".i-cu")); }
      else { rec.costo_unitario_voce=N(g(".i-cuv")); rec.budget=N(g(".i-bud")); }
      const {error}=await sb.from("sito_interventi").update(rec).eq("id",id);
      if(error){ toast("Errore su "+intv.nome); continue; }
      if(intv.tipo!=="piante"){
        const present=[];
        for(const r of card.querySelectorAll(".sv-row")){
          const nome=r.querySelector(".sv-nome").value.trim(); if(!nome)continue;
          const svid=r.dataset.svid;
          if(svid){await sb.from("sottovoci").update({nome}).eq("id",+svid);present.push(+svid);}
          else{const {data:ins}=await sb.from("sottovoci").insert({sito_intervento_id:id,nome}).select().single();if(ins)present.push(ins.id);}
        }
        const existing=(await sb.from("sottovoci").select("id").eq("sito_intervento_id",id)).data||[];
        for(const e of existing) if(!present.includes(e.id)) await sb.from("sottovoci").delete().eq("id",e.id);
      }
    }
    toast("Categoria salvata ✓");SETUP.interventi();
  };
 },

 /* ---- Pesi categorie (per sito) ---- */
 async pesi(){
  const sid=+($("#w-sito")?.value||DB.siti[0].id);
  const {data:sc}=await sb.from("sito_categorie").select("*").eq("sito_id",sid);
  const {data:siAtt}=await sb.from("sito_interventi").select("intervento_id").eq("sito_id",sid).eq("attivo",true);
  const catPresenti=new Set((siAtt||[]).map(x=>{const i=DB.interventi.find(j=>j.id===x.intervento_id);return i&&i.categoria_id;}));
  const rows=DB.categorie.map(c=>{
    const w=(sc||[]).find(x=>x.categoria_id===c.id)||{};
    const pres=catPresenti.has(c.id);
    return `<div class="dyn-row" style="grid-template-columns:1.5fr .6fr" data-cat="${c.id}">
      <b style="align-self:center;${pres?"":"opacity:.45"}">${esc(c.nome)}${pres?"":' <span class="muted">(nessun intervento attivo)</span>'}</b>
      <div><label>Peso %</label><input type="number" class="w-val" value="${w.peso_pct||0}"></div></div>`;
  }).join("");
  $("#setup-body").innerHTML=`<div class="card"><h2>Pesi delle categorie</h2>
    <div class="field"><label>Sito</label><select id="w-sito">${DB.siti.map(s=>`<option value="${s.id}" ${s.id===sid?"selected":""}>${esc(s.nome)}</option>`).join("")}</select></div>
    <p class="muted" id="w-sum"></p>
    <p class="muted">I pesi dicono quanto ogni categoria incide sull'avanzamento del sito (e quindi sugli ettari). Il sistema <b>ricalibra automaticamente</b> sulle categorie presenti, quindi non devono per forza sommare 100 — ma è la situazione ideale.</p></div>
    ${rows}<button class="btn btn-p" id="w-save">Salva pesi</button>`;
  const upd=()=>{const t=$$(".w-val").reduce((s,i)=>s+(+i.value||0),0);
    $("#w-sum").innerHTML=`Somma pesi: <b style="color:${t===100?'var(--forest)':'var(--gold)'}">${t}%</b>`;};
  $$(".w-val").forEach(i=>i.oninput=upd);upd();
  $("#w-sito").onchange=()=>SETUP.pesi();
  $("#w-save").onclick=async()=>{
    for(const r of $$("#setup-body [data-cat]"))
      await sb.from("sito_categorie").upsert({sito_id:sid,categoria_id:+r.dataset.cat,peso_pct:+r.querySelector(".w-val").value||0},{onConflict:"sito_id,categoria_id"});
    toast("Pesi salvati ✓");};
 },
};

async function anag(table,titolo,campi,perSito=false){
  const {data}=await sb.from(table).select("*").order("id");
  $("#setup-body").innerHTML=`<div class="card"><h2>${titolo}</h2>
   <div id="an-list">${(data||[]).map(r=>`<div class="dyn-row" style="grid-template-columns:${perSito?"1fr ":""}1.2fr .8fr auto" data-id="${r.id}">
     ${perSito?`<select class="an-sito">${DB.siti.map(s=>`<option value="${s.id}" ${s.id===r.sito_id?"selected":""}>${esc(s.nome)}</option>`).join("")}</select>`:""}
     ${campi.map(([k,l,t])=>`<input class="an-${k}" type="${t||"text"}" value="${esc(r[k])}" placeholder="${l}">`).join("")}
     <button class="x an-off" title="disattiva">×</button></div>`).join("")}</div>
   <button class="add" id="an-add">+ Aggiungi</button>
   <button class="btn btn-p" id="an-save" style="margin-top:10px">Salva</button></div>`;
  $("#an-add").onclick=()=>{$("#an-list").insertAdjacentHTML("beforeend",
    `<div class="dyn-row" style="grid-template-columns:${perSito?"1fr ":""}1.2fr .8fr auto" data-id="">
     ${perSito?`<select class="an-sito">${DB.siti.map(s=>`<option value="${s.id}">${esc(s.nome)}</option>`).join("")}</select>`:""}
     ${campi.map(([k,l,t])=>`<input class="an-${k}" type="${t||"text"}" placeholder="${l}">`).join("")}
     <button class="x an-off">×</button></div>`);bindOff()};
  function bindOff(){$$(".an-off").forEach(x=>x.onclick=async()=>{
    const row=x.parentNode,id=row.dataset.id;
    if(id) await sb.from(table).update({attivo:false}).eq("id",+id);
    row.remove()})}
  bindOff();
  $("#an-save").onclick=async()=>{
    for(const r of $$("#an-list .dyn-row")){
      const rec={};
      for(const [k] of campi){const v=r.querySelector(".an-"+k).value;rec[k]=isNaN(+v)||v===""?v:+v}
      if(perSito)rec.sito_id=+r.querySelector(".an-sito").value;
      if(!rec[campi[0][0]])continue;
      const id=r.dataset.id;
      if(id)await sb.from(table).update(rec).eq("id",+id);
      else await sb.from(table).insert(rec);
    }
    toast("Salvato ✓");
    const fresh=await sb.from(table).select("*").eq("attivo",true).order("nome");
    DB[table]=fresh.data||[];
    anag(table,titolo,campi,perSito)};
}

/* ---------------- avvio ---------------- */
start();
