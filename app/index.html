/* ============ LIBRERIE CARICATE SOLO QUANDO SERVONO ============ */
function caricaLib(url, test){
  if(test()) return Promise.resolve();
  return new Promise((ok,ko)=>{
    const t=document.createElement("script");
    t.src=url; t.onload=()=>ok(); t.onerror=()=>ko(new Error("libreria non raggiungibile"));
    document.head.appendChild(t);
  });
}
const libZip  = () => caricaLib("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js", ()=>!!window.JSZip);
const libTurf = () => caricaLib("https://cdnjs.cloudflare.com/ajax/libs/Turf.js/7.1.0/turf.min.js",  ()=>!!window.turf);

/* ============ IMPORTAZIONE DA KMZ / KML ============ */
function collegaImport(){
  const f=$("#a-file"), b=$("#a-imp");
  if(!f||!b) return;
  b.onclick=()=>f.click();
  f.onchange=async()=>{ const file=f.files&&f.files[0]; f.value=""; if(file) await leggiFileAree(file); };
}
function areeDaKml(testo){
  const doc=new DOMParser().parseFromString(testo,"text/xml");
  if(doc.querySelector("parsererror")) throw new Error("file illeggibile");
  const pezzi=[], letti=(nodo)=>{
    const t=(nodo.textContent||"").trim();
    const out=[];
    for(const c of t.split(/\s+/)){
      if(!c) continue;
      const q=c.split(";")[0].split(",");
      if(q.length>=2){ const la=+q[1], lo=+q[0]; if(isFinite(la)&&isFinite(lo)) out.push([la,lo]); }
    }
    if(out.length>1){ const a=out[0], z=out[out.length-1]; if(a[0]===z[0]&&a[1]===z[1]) out.pop(); }
    return out;
  };
  let senza=0;
  doc.querySelectorAll("Placemark").forEach(pm=>{
    let nome=""; 
    for(const c of pm.children) if(c.tagName==="name"){ nome=(c.textContent||"").trim(); break; }
    const anelli=[...pm.querySelectorAll("outerBoundaryIs LinearRing coordinates")];
    const linee = anelli.length ? [] : [...pm.querySelectorAll("LineString coordinates")];
    [...anelli, ...linee].forEach(nodo=>{
      const pts=letti(nodo);
      if(pts.length<3) return;
      pezzi.push({nome: nome || "", pts, ettari: ettariDi(pts)});
    });
  });
  pezzi.forEach((z,i)=>{ if(!z.nome) z.nome="Area "+(i+1); });
  return pezzi;
}
async function leggiFileAree(file){
  try{
    let testo;
    if(/\.kmz$/i.test(file.name)){
      await libZip();
      const zip=await JSZip.loadAsync(await file.arrayBuffer());
      const dentro=Object.keys(zip.files).find(x=>/\.kml$/i.test(x));
      if(!dentro) throw new Error("nel KMZ non c'è nessun KML");
      testo=await zip.file(dentro).async("string");
    } else testo=await file.text();
    const trovate=areeDaKml(testo);
    if(!trovate.length) return toast("Nel file non ci sono aree riconoscibili");
    const buone=trovate.filter(z=>z.ettari>=0.1);
    const scarti=trovate.length-buone.length;
    if(!buone.length) return toast("Tutte le zone del file sono sotto 0,1 ha");
    SA.imp={buone, scarti, nomeFile:file.name};
    SA.modo="import";
    // anteprima sulla mappa
    SA.prev=(SA.prev||[]); SA.prev.forEach(l=>SA.map.removeLayer(l)); SA.prev=[];
    buone.forEach(z=>{
      const pl=L.polygon(z.pts,{color:"#E8A33D",weight:2,dashArray:"6,4",fillColor:"#E8A33D",fillOpacity:.25,interactive:false}).addTo(SA.map);
      SA.prev.push(pl);
    });
    SA.map.fitBounds(L.latLngBounds(buone.flatMap(z=>z.pts)),{padding:[30,30],maxZoom:19});
    barraAree(); elencoAree();
  }catch(e){ toast("Non riesco a leggere il file: "+e.message); }
}
window.saImportaAnnulla = () => {
  (SA.prev||[]).forEach(l=>SA.map.removeLayer(l)); SA.prev=[];
  SA.imp=null; SA.modo=null; barraAree(); elencoAree(); inquadra();
};
window.saImportaConferma = async () => {
  const imp=SA.imp; if(!imp) return;
  const esistenti=new Set(SA.aree.map(a=>a.nome.toLowerCase()));
  const righe=imp.buone.map((z,i)=>{
    let nome=z.nome, k=1;
    while(esistenti.has(nome.toLowerCase())) nome=z.nome+" ("+(++k)+")";
    esistenti.add(nome.toLowerCase());
    return {sito_id:SA.sid, nome, geom:versoGeoJSON(z.pts), ettari:Math.round(z.ettari*100)/100, ordine:(SA.aree.length+i+1)};
  });
  const {error}=await sb.from("sotto_aree").insert(righe);
  if(error) return toast("Errore nell'importazione: "+(error.message||""));
  toast(righe.length+" aree importate ✓");
  saImportaAnnulla();
  await ricaricaAree();
};
async function ricaricaAree(){
  const {data}=await sb.from("sotto_aree").select("*").eq("sito_id",SA.sid).order("ordine");
  SA.aree=data||[]; pitturaAree(); barraAree(); elencoAree(); inquadra();
}

/* ============ MODIFICA DEI VERTICI ============ */
window.saVertici = (id) => {
  pulisciBozza(); pulisciModifica();
  const a=SA.aree.find(x=>x.id===id); if(!a) return;
  SA.modo="vertici"; SA.target=id; SA.punti=daGeoJSON(a.geom).map(p=>[p[0],p[1]]);
  SA.strati.forEach(l=>SA.map.removeLayer(l)); SA.strati=[];
  disegnaModifica();
  SA.map.fitBounds(L.latLngBounds(SA.punti),{padding:[40,40],maxZoom:19});
  barraAree(); elencoAree();
};
function pulisciModifica(){
  (SA.maniglie||[]).forEach(m=>SA.map.removeLayer(m)); SA.maniglie=[];
  (SA.mezzi||[]).forEach(m=>SA.map.removeLayer(m)); SA.mezzi=[];
  if(SA.forma){ SA.map.removeLayer(SA.forma); SA.forma=null; }
}
function disegnaModifica(){
  pulisciModifica();
  SA.forma=L.polygon(SA.punti,{color:"#C0392B",weight:2,fillColor:"#E8A33D",fillOpacity:.2,
    interactive:false}).addTo(SA.map);
  const icona=(c)=>L.divIcon({className:"", html:`<div style="width:14px;height:14px;border-radius:50%;background:${c};border:2px solid #fff;box-shadow:0 0 3px rgba(0,0,0,.6)"></div>`, iconSize:[14,14], iconAnchor:[7,7]});
  SA.maniglie=SA.punti.map((p,i)=>{
    const m=L.marker(p,{draggable:true, icon:icona("#C0392B")}).addTo(SA.map);
    m.on("drag",e=>{ const ll=e.target.getLatLng(); SA.punti[i]=[ll.lat,ll.lng]; SA.forma.setLatLngs(SA.punti); });
    m.on("dragend",()=>{ disegnaModifica(); barraAree(); });
    m.on("click",()=>{
      if(SA.punti.length<=3) return toast("Un'area non può avere meno di tre punti");
      SA.punti.splice(i,1); disegnaModifica(); barraAree(); toast("Punto tolto");
    });
    return m;
  });
  SA.mezzi=SA.punti.map((p,i)=>{
    const q=SA.punti[(i+1)%SA.punti.length];
    const m=L.marker([(p[0]+q[0])/2,(p[1]+q[1])/2],{icon:icona("rgba(255,255,255,.75)")}).addTo(SA.map);
    m.on("click",()=>{ SA.punti.splice(i+1,0,[(p[0]+q[0])/2,(p[1]+q[1])/2]); disegnaModifica(); barraAree(); });
    return m;
  });
}
window.saVerticiAnnulla = () => { pulisciModifica(); SA.modo=null; SA.target=null; SA.punti=[]; pitturaAree(); barraAree(); elencoAree(); };
window.saVerticiSalva = async () => {

  const {error}=await sb.from("sotto_aree").update({geom:versoGeoJSON(SA.punti), ettari:et}).eq("id",id);
  if(error) return toast("Errore nel salvataggio");
  toast("Area aggiornata ✓ ("+ha(et)+")");
  pulisciModifica(); SA.modo=null; SA.target=null; SA.punti=[];

};

/* ============ UNIONE DI PIÙ AREE ============ */
window.saUnisci = () => { pulisciBozza(); pulisciModifica(); SA.modo="unisci"; SA.scelte=[]; pitturaAree(); barraAree(); elencoAree(); };
window.saUnisciAnnulla = () => { SA.modo=null; SA.scelte=[]; barraAree(); elencoAree(); };
window.saUnisciConferma = async () => {
  const ids=SA.scelte||[];
  if(ids.length<2) return toast("Scegli almeno due aree da unire");
  try{
    await libTurf();
    const scelte=ids.map(i=>SA.aree.find(a=>a.id===i)).filter(Boolean);
    let acc=turf.polygon(scelte[0].geom.coordinates);
    for(let i=1;i<scelte.length;i++){
      const u=turf.union(turf.featureCollection([acc, turf.polygon(scelte[i].geom.coordinates)]));
      if(!u) throw new Error("unione non riuscita");
      acc=u;
    }
    if(acc.geometry.type!=="Polygon")
      return toast("Le aree scelte non si toccano: l'unione darebbe pezzi separati");
    const pts=acc.geometry.coordinates[0].map(c=>[c[1],c[0]]);
    if(pts.length>1 && pts[0][0]===pts[pts.length-1][0] && pts[0][1]===pts[pts.length-1][1]) pts.pop();
    const et=Math.round(ettariDi(pts)*100)/100;
    const primo=scelte[0];
    const {error}=await sb.from("sotto_aree").update({geom:versoGeoJSON(pts), ettari:et}).eq("id",primo.id);
    if(error) return toast("Errore nel salvataggio");
    for(const a of scelte.slice(1)){
      const {error:e2}=await sb.from("sotto_aree").delete().eq("id",a.id);
      if(e2){ toast("Unite, ma «"+a.nome+"» non si è potuta eliminare"); }
    }
    toast("Aree unite in «"+primo.nome+"» ✓ ("+ha(et)+")");
    SA.modo=null; SA.scelte=[];
    await ricaricaAree();
  }catch(e){ toast("Unione non riuscita: "+e.message); }
};

function puntoTaglio(latlng){
  SA.taglio.push([latlng.lat,latlng.lng]);
  if(SA.lineaT){ SA.map.removeLayer(SA.lineaT); SA.lineaT=null; }
  if(SA.taglio.length>=2)
    SA.lineaT=L.polyline(SA.taglio,{color:"#C0392B",weight:3,dashArray:"6,4"}).addTo(SA.map);
  barraAree();
}
/* taglio con una retta: si tiene la parte da ciascun lato (algoritmo di Sutherland-Hodgman) */
function mezzoPiano(pts, A, B, segno){
  const lato=p=>((B[1]-A[1])*(p[0]-A[0])-(B[0]-A[0])*(p[1]-A[1]))*segno;
  const taglia=(p,q)=>{ const dp=lato(p), dq=lato(q), t=dp/(dp-dq);
    return [p[0]+(q[0]-p[0])*t, p[1]+(q[1]-p[1])*t]; };
  const out=[];
  for(let i=0;i<pts.length;i++){
    const p=pts[i], q=pts[(i+1)%pts.length], dp=lato(p), dq=lato(q);
    if(dp>=0) out.push(p);
    if((dp>0&&dq<0)||(dp<0&&dq>0)) out.push(taglia(p,q));
  }
  return out;
}

window.saDividiConferma = async () => {
  const a=SA.aree.find(x=>x.id===SA.target);

  const pts=daGeoJSON(a.geom);
  const [A,B]=SA.taglio;
  const uno=mezzoPiano(pts,A,B,1), due=mezzoPiano(pts,A,B,-1);
  if(uno.length<3||due.length<3) return toast("La linea non attraversa l'area: spostala");
  const e1=Math.round(ettariDi(uno)*100)/100, e2=Math.round(ettariDi(due)*100)/100;

};

  $("#i-lotto").onchange=async()=>{ await setupAutoSalva(); SETUP.interventi(); };
  $$(".i-attivo").forEach(ch=>ch.onchange=()=>ch.closest(".int-card").querySelector(".i-body").classList.toggle("hide",!ch.checked));
  // budget = quantità x costo unitario (auto, sovrascrivibile)
  $$(".int-card").forEach(card=>{

  function bindDel(){$$(".sv-del").forEach(x=>x.onclick=()=>x.closest(".sv-row").remove());}

  bindDel();
  $$(".i-ann").forEach(b=>b.onclick=async()=>{

    const {error}=await sb.from("sito_interventi").update({annullato:!era, attivo:era?true:false}).eq("id",id);

  });
  async function aggiungiAlSito(intId, lotto){
    const {data,error}=await sb.from("sito_interventi")
      .insert({sito_id:sid,intervento_id:intId,lotto,attivo:true}).select().single();
    if(error){
      toast(error.code==="23505"

        : "Errore nell'aggiunta");
      return null;
    }
    // porto la vista sulla riga appena creata, altrimenti resta nascosta dai filtri
    const iv=DB.interventi.find(i=>i.id===intId);
    if(iv) CAT_SEL=iv.categoria_id;
    LOTTO_SEL=lotto; NUOVA_RIGA=data.id;
    toast("Lavorazione aggiunta ✓");
    await SETUP.interventi();
    const el=document.querySelector(`.int-card[data-si="${data.id}"]`);
    if(el){ el.scrollIntoView({behavior:"smooth",block:"center"}); el.classList.add("appena"); }

  $("#add-go").onclick=()=>aggiungiAlSito(+$("#add-int").value, $("#add-lot").value);
  $("#new-go").onclick=async()=>{
    const nome=$("#new-nome").value.trim();
    if(!nome) return toast("Indica il nome della lavorazione");
    if(DB.interventi.some(i=>i.nome.toLowerCase()===nome.toLowerCase()))
      return toast("Esiste già una lavorazione con questo nome");
    const {data,error}=await sb.from("interventi").insert({
      categoria_id:+$("#new-cat").value, categoria_perizia_id:+$("#new-pz").value,
      nome, modalita:"da_definire", tipo:$("#new-tipo").value,
      ordine:(DB.interventi.reduce((m,i)=>Math.max(m,i.ordine||0),0)+1)}).select().single();
    if(error) return toast("Errore nella creazione");
    // l'anagrafica in memoria si aggiorna subito: la voce compare ovunque
    DB.interventi.push(data);
    DB.interventi.sort((a,b)=>(a.categoria_id-b.categoria_id)||(a.ordine-b.ordine));

    if(badI.length){
      const nome=(DB.interventi.find(i=>i.id===+badI[0].closest(".int-card").dataset.int)||{}).nome||"";
      badI[0].scrollIntoView({block:"center"});
      return toast("Data non valida su «"+nome+"»: usa un anno tra "+ANNO_MIN+" e "+ANNO_MAX+". Niente salvato.");
    }
    for(const card of $$(".int-card")){
      if(card.classList.contains("annull")) continue;
      const id=+card.dataset.si, intv=DB.interventi.find(i=>i.id===+card.dataset.int);

        per_sotto_area:g(".i-psa").checked,
        durata_giorni:N(g(".i-dur")), data_inizio:g(".i-ini").value||null,
        note:g(".i-note").value.trim()||null,
        dipende_da: g(".i-dip-on").checked ? (+g(".i-dip").value||null) : null};
      if(rec.dipende_da){
        const prova=tutte.map(x=>x.id===id?{...x,dipende_da:rec.dipende_da}:x);
        if(creaCiclo(prova,id,rec.dipende_da)){
          toast("Dipendenza circolare su "+intv.nome+": non salvata"); rec.dipende_da=null;
        } else rec.data_inizio=null;
      }
      if(intv.tipo==="piante"){
        rec.piante_previste=N(g(".i-pp")); rec.costo_unitario=N(g(".i-cu"));
        rec.unita_misura="pianta"; rec.quantita=rec.piante_previste; rec.budget=null;
      } else {
        rec.unita_misura=g(".i-um").value.trim()||null; rec.quantita=N(g(".i-qt"));
        rec.costo_unitario_voce=N(g(".i-cuv")); rec.budget=N(g(".i-bud"));
      }
      const {error}=await sb.from("sito_interventi").update(rec).eq("id",id);
      if(error){ toast("Errore su "+intv.nome); continue; }
      if(intv.tipo!=="piante"){
        const present=[];
        for(const r of card.querySelectorAll(".sv-row")){
          const nome=r.querySelector(".sv-nome").value.trim(); if(!nome)continue;
          const svid=r.dataset.svid;
          if(svid){await sb.from("sottovoci").update({nome}).eq("id",+svid);present.push(+svid);}
          else{const {data:ins}=await sb.from("sottovoci").insert({sito_intervento_id:id,nome}).select().single();if(ins)present.push(ins.id);}
        }
        const existing=(await sb.from("sottovoci").select("id").eq("sito_intervento_id",id)).data||[];
        for(const e of existing) if(!present.includes(e.id)) await sb.from("sottovoci").delete().eq("id",e.id);
      }
    }
    SETUP_DIRTY=false; setupAggiornaStato();
    if(silenzioso){ toast("Modifiche salvate ✓"); return; }
    toast("Categoria salvata ✓");SETUP.interventi();
  };
  SETUP_SALVA=salvaCategoria;
  $("#i-save").onclick=()=>salvaCategoria(false);
  SETUP_DIRTY=false; setupAggiornaStato();   // render pulito: nessuna modifica in sospeso
 },

 /* ---- Assegnazioni FM -> siti ---- */
 async assegnazioni(){
  const [{data:prof},{data:ass}] = await Promise.all([
    sb.from("profili").select("*").order("nome"),
    sb.from("profili_siti").select("*"),
  ]);
  const fm=(prof||[]).filter(u=>!u.super_user && !u.sola_lettura);

  const blocchi=fm.map(u=>`<div class="card" data-prof="${u.id}" style="padding:12px">
      <b>${esc(u.nome)}</b> <span class="muted">${esc(u.ruolo||"")}</span>
      <div class="as-grid">${DB.siti.map(s=>`<label class="chk2 as-chk">

      const uid=card.dataset.prof;
      const vuole=[...card.querySelectorAll(".as-sito")].filter(c=>c.checked).map(c=>+c.dataset.sito);
      await sb.from("profili_siti").delete().eq("profilo_id",uid);
      for(const sid of vuole) await sb.from("profili_siti").insert({profilo_id:uid,sito_id:sid});
    }
    SETUP_DIRTY=false; setupAggiornaStato();
    toast(silenzioso?"Modifiche salvate \u2713":"Assegnazioni salvate \u2713");
  };
  SETUP_SALVA=salvaAss;
  $("#as-save").onclick=()=>salvaAss(false);
  SETUP_DIRTY=false; setupAggiornaStato();
 },

 async pesi(){

 },

async function anag(table,titolo,campi,perSito=false){
  const {data}=await sb.from(table).select("*").eq("attivo",true).order("id");
  // campo generico: testo, numero, oppure tendina su una lista master ("select:comuni")
  const campo=(k,l,t,v)=>{
    if(t&&t.startsWith("select:")){
      const lista=DB[t.slice(7)]||[];
      return `<select class="an-${k}"><option value="">— ${esc(l)} —</option>${
        lista.map(o=>`<option value="${o.id}" ${v===o.id?"selected":""}>${esc(o.nome)}</option>`).join("")}</select>`;
    }
    return `<input class="an-${k}" type="${t||"text"}" value="${esc(v??"")}" placeholder="${esc(l)}">`;
  };
  const cols=(perSito?"1fr ":"")+campi.map(([k,l,t])=>t==="number"?".7fr":"1fr").join(" ")+" auto";
  $("#setup-body").innerHTML=`<div class="card"><h2>${titolo}</h2>
   <div id="an-list">${(data||[]).map(r=>`<div class="dyn-row" style="grid-template-columns:${cols}" data-id="${r.id}">
     ${perSito?`<select class="an-sito">${DB.siti.map(s=>`<option value="${s.id}" ${s.id===r.sito_id?"selected":""}>${esc(s.nome)}</option>`).join("")}</select>`:""}
     ${campi.map(([k,l,t])=>campo(k,l,t,r[k])).join("")}
     <button class="x an-off" title="disattiva">×</button></div>`).join("")}</div>
   <button class="add" id="an-add">+ Aggiungi</button>
   <button class="btn btn-p" id="an-save" style="margin-top:10px">Salva</button></div>`;
  $("#an-add").onclick=()=>{$("#an-list").insertAdjacentHTML("beforeend",
    `<div class="dyn-row" style="grid-template-columns:${cols}" data-id="">
     ${perSito?`<select class="an-sito">${DB.siti.map(s=>`<option value="${s.id}">${esc(s.nome)}</option>`).join("")}</select>`:""}
     ${campi.map(([k,l,t])=>campo(k,l,t,null)).join("")}
     <button class="x an-off">×</button></div>`);bindOff()};
  function bindOff(){$$(".an-off").forEach(x=>x.onclick=async()=>{
    const row=x.parentNode,id=row.dataset.id;
    if(id){ await sb.from(table).update({attivo:false}).eq("id",+id);
      DB[table]=(DB[table]||[]).filter(x=>x.id!==+id); }
    row.remove()})}
  bindOff();
  const salvaAnag=async(silenzioso)=>{
    const scartati=[], senzaCampo=[];
    for(const r of $$("#an-list .dyn-row")){
      const rec={};
      for(const [k,,t] of campi){
        const v=r.querySelector(".an-"+k).value;
        if(t&&t.startsWith("select:")) rec[k]=v===""?null:+v;
        else if(t==="number") rec[k]=v===""?0:+v;
        else rec[k]=v;
      }
      if(perSito)rec.sito_id=+r.querySelector(".an-sito").value;
      const nome=String(rec[campi[0][0]]??"").trim();
      if(!nome)continue;
      // le tendine su liste master sono obbligatorie: senza, la voce non sarebbe visibile a nessun sito
      const vuoto=campi.find(([k,,t])=>t&&t.startsWith("select:")&&rec[k]==null);
      if(vuoto){ senzaCampo.push(nome+" (manca "+vuoto[1].toLowerCase()+")"); continue; }
      const id=r.dataset.id;
      if(id){ await sb.from(table).update(rec).eq("id",+id); }
      else {
        // un nome uguale a una voce già attiva sarebbe un doppione
        const gia=(data||[]).some(x=>String(x[campi[0][0]]??"").trim().toLowerCase()===nome.toLowerCase());
        if(gia){ scartati.push(nome); continue; }
        await sb.from(table).insert(rec);
      }
    }
    const avvisi=[];
    if(scartati.length)   avvisi.push("già in elenco: "+scartati.join(", "));
    if(senzaCampo.length) avvisi.push("non salvate: "+senzaCampo.join(", "));
    SETUP_DIRTY=false; setupAggiornaStato();
    toast(avvisi.length ? "Salvato, ma "+avvisi.join(" · ") : (silenzioso?"Modifiche salvate ✓":"Salvato ✓"));
    const fresh=await sb.from(table).select("*").eq("attivo",true).order("nome");
    DB[table]=fresh.data||[];
    if(!silenzioso) anag(table,titolo,campi,perSito)};
  SETUP_SALVA=salvaAnag;
  $("#an-save").onclick=()=>salvaAnag(false);
  SETUP_DIRTY=false; setupAggiornaStato();   // render pulito: nessuna modifica in sospeso
}

window.addEventListener("beforeunload", e=>{ if(SETUP_DIRTY){ e.preventDefault(); e.returnValue=""; } });

/* ---------------- avvio ---------------- */
start();
</script>
</body>
</html>
