<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Halaesa — Controllo OS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --forest:#1F5C2E; --forest-d:#16441F; --moss:#6FA84A; --lime:#C6DFA3;
  --gold:#E8A33D; --paper:#FAFAF7; --ink:#1A2418; --mut:#6B7565;
  --line:#E2E5DC; --white:#FFFFFF; --red:#C0392B;
  --r:12px; --r-s:8px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--paper);color:var(--ink);font-size:16px;line-height:1.45;
  padding-bottom:84px}
h1,h2,h3{line-height:1.2}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;
  padding:12px;border:1.5px solid var(--line);border-radius:var(--r-s);
  background:var(--white);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--moss);border-color:var(--moss)}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.req::after{content:" •";color:var(--gold);font-weight:900}

/* ---------- struttura ---------- */
.hdr{background:var(--forest);color:var(--white);padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50}
.hdr .brand{font-weight:800;letter-spacing:.02em;font-size:17px}
.hdr .brand small{display:block;font-weight:500;font-size:11px;opacity:.75;letter-spacing:.08em;text-transform:uppercase}
.hdr .who{text-align:right;font-size:12px;opacity:.9}
.hdr .who b{display:block;font-size:13px}
.wrap{max-width:680px;margin:0 auto;padding:16px}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:14px}
.card h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--forest);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .n{background:var(--lime);color:var(--forest-d);width:24px;height:24px;
  border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800}
.field{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.muted{color:var(--mut);font-size:13px}
.btn{display:block;width:100%;padding:15px;border-radius:var(--r-s);
  font-size:16px;font-weight:700;text-align:center}
.btn-p{background:var(--forest);color:var(--white)}
.btn-p:active{background:var(--forest-d)}
.btn-g{background:var(--lime);color:var(--forest-d)}
.btn-o{background:var(--white);color:var(--forest);border:1.5px solid var(--forest)}
.btn-sm{width:auto;padding:8px 14px;font-size:13px;border-radius:7px}
.btn[disabled]{opacity:.5}

/* ---------- fasce discrete (elemento firma) ---------- */
.fasce{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.fascia{padding:13px 2px;border-radius:var(--r-s);border:1.5px solid var(--line);
  background:var(--white);font-weight:700;font-size:13px;text-align:center;
  color:var(--mut);transition:all .12s}
.fascia small{display:block;font-weight:500;font-size:10px;margin-top:1px}
.fascia.on{background:var(--forest);border-color:var(--forest);color:var(--white)}
.fascia.zero.on{background:var(--mut);border-color:var(--mut)}

/* ---------- liste dinamiche ---------- */
.dyn{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.dyn-row{display:grid;gap:8px;margin-bottom:10px;align-items:end}
.x{background:none;color:var(--red);font-size:20px;font-weight:800;padding:0 8px}
.add{background:none;color:var(--moss);font-weight:700;font-size:14px;padding:6px 0}

/* ---------- checkbox grandi (macchine) ---------- */
.chip{display:flex;align-items:center;gap:8px;padding:10px;border:1.5px solid var(--line);
  border-radius:var(--r-s);background:var(--white);font-size:14px;font-weight:600}
.chip input{width:22px;height:22px;accent-color:var(--forest)}
.chip.gold input{accent-color:var(--gold)}

/* ---------- tab bar ---------- */
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--white);
  border-top:1px solid var(--line);display:flex;z-index:60}
.tab{flex:1 1 0;min-width:0;padding:10px 2px 12px;text-align:center;font-size:11px;font-weight:700;
  color:var(--mut);background:none;text-transform:uppercase;letter-spacing:.03em;
  overflow:hidden;line-height:1.15}
.tab .ic{display:block;font-size:20px;margin-bottom:2px}
.tab.on{color:var(--forest)}
.tab.on .ic{transform:scale(1.1)}
@media(max-width:520px){
  .tab{font-size:9px;letter-spacing:0;padding:8px 1px 10px}
  .tab .ic{font-size:17px;margin-bottom:1px}
}
@media(max-width:400px){ .tab{font-size:8.2px;letter-spacing:-.02em} }
@media(max-width:360px){ .tab{font-size:7.5px} .tab .ic{font-size:15px} }

/* ---------- viste / dashboard ---------- */
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.kpi .k{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .k .kpi-b{display:block;margin-bottom:2px}
.kpi .k .kpi-inp{font-size:20px;font-weight:800;color:var(--forest);padding:4px 6px;border:1px dashed var(--line);
  border-radius:6px;background:transparent;width:100%}
.kpi .k .kpi-inp:focus{border-style:solid;border-color:var(--moss);outline:none}
.kpi-sco-r{font-size:10.5px;color:var(--mut);margin-top:4px;line-height:1.3}
.kpi-sco{font-weight:700;color:var(--ink);white-space:nowrap}
.kpi .k b{font-size:22px;color:var(--forest);display:block}
.kpi .k span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--moss);border-radius:5px}
.bar i.over{background:var(--red)}
.att-row{padding:12px 0;border-bottom:1px solid var(--line)}
.att-row:last-child{border:none}
.att-row .t{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.att-row .s{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.pill{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px}
.pill.ok{background:var(--lime);color:var(--forest-d)}
.pill.late{background:#FDEBD0;color:#9A6B1F}
.pill.bad{background:#FADBD8;color:var(--red)}
table.grid{width:100%;border-collapse:collapse;font-size:12px}
table.grid th{background:var(--forest);color:var(--white);padding:7px 5px;text-align:right;font-weight:700}
table.grid th:first-child{text-align:left}
table.grid td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:right}
table.grid td:first-child{text-align:left;font-weight:600}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- login ---------- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--forest) 0%,var(--forest-d) 100%);padding:20px}
.login .box{background:var(--white);border-radius:16px;padding:28px 24px;width:100%;max-width:380px}
.login .logo{text-align:center;margin-bottom:22px}
.login .logo b{font-size:24px;color:var(--forest);letter-spacing:.01em}
.login .logo span{display:block;font-size:11px;color:var(--mut);
  text-transform:uppercase;letter-spacing:.14em;margin-top:2px}
.err{background:#FADBD8;color:var(--red);padding:10px;border-radius:var(--r-s);
  font-size:13px;margin-bottom:12px;display:none}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);
  background:var(--forest-d);color:var(--white);padding:12px 22px;border-radius:99px;
  font-weight:700;font-size:14px;z-index:1200;box-shadow:0 4px 16px rgba(0,0,0,.25);
  opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.hide{display:none!important}
.banner{background:var(--gold);color:#5B3D0E;padding:10px 14px;border-radius:var(--r-s);
  font-size:13px;font-weight:600;margin-bottom:14px}
.sitobar{position:sticky;top:56px;z-index:40;background:var(--lime);
  display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:2px solid var(--moss)}
.sitobar .sb-l{font-size:12px;font-weight:700;color:var(--forest-d);text-transform:uppercase;letter-spacing:.04em}
.sitobar .sb-site{font-size:18px;font-weight:800;color:var(--forest-d)}
.sitobar select{font-size:17px;font-weight:800;color:var(--forest-d);background:var(--white);
  border:1.5px solid var(--moss);padding:8px 10px;width:auto;flex:1;max-width:340px}
.cat-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.int-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;border-top:1px solid var(--line)}
.cost-r{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px solid var(--line)}
.cost-tot{font-size:16px;font-weight:800;color:var(--forest);border-bottom:none;border-top:2px solid var(--forest);margin-top:4px;padding-top:8px}
.scad-row{padding:10px 0;border-bottom:1px solid #EEF1EA}
.scad-row:last-of-type{border-bottom:none}
.scad-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.scad-nome{font-weight:700;font-size:14px}
.scad-badge{color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:10px;white-space:nowrap;text-transform:uppercase;letter-spacing:.02em}
.scad-meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut);margin:3px 0 6px}
.scad-bar{position:relative;height:10px;background:var(--line);border-radius:5px;overflow:visible}
.scad-fill{display:block;height:100%;background:var(--moss);border-radius:5px}
.scad-today{position:absolute;top:-3px;width:2px;height:16px;background:var(--ink);border-radius:1px}
.scad-today::after{content:"oggi";position:absolute;top:-13px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--ink);font-weight:700}
.rit-note{font-size:12px;color:#9A3B2C;margin-top:5px}
.rit-fm{color:#B8841F}
details.pan{padding:0}
details.pan>summary.pan-h{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;
  flex-wrap:wrap;padding:14px 16px}
details.pan>summary.pan-h::-webkit-details-marker{display:none}
details.pan .pan-t{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--forest)}
details.pan .pan-apri{margin-left:auto;font-size:11px;color:var(--mut);border:1px solid var(--line);
  border-radius:20px;padding:2px 10px}
details.pan[open] .pan-apri::after{content:" ▲"}
details.pan:not([open]) .pan-apri::after{content:" ▼"}
details.pan .pan-b{padding:0 16px 16px}
.mg-dove{display:block;font-size:10.5px;font-weight:600;color:#B8841F;margin-top:1px}
.as-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}
.as-chk{border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:12.5px}
.fm-list{margin-top:4px}
.fm-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0;font-size:12px}
.fm-rev{opacity:.55;text-decoration:line-through}
.rev-btn{border:1px solid #B8841F;color:#B8841F;background:#fff;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;white-space:nowrap;text-decoration:none}
.scad-sco{font-size:12px;margin-top:5px}
.sco{font-weight:600}
.sco-bad{color:#C0392B}
.sco-ok{color:#2E7D32}
.banner-alert{background:#FBE9E5;border-left:4px solid #C0392B;color:#7A2418;font-weight:600}
.cat-block{margin:14px 0}
.cat-h{font-size:13px;font-weight:800;color:var(--forest);text-transform:uppercase;letter-spacing:.03em;
  border-bottom:2px solid var(--lime);padding-bottom:5px;margin:0 0 10px}
.int-block{margin:0 0 14px;padding-left:10px;border-left:3px solid #E3E7DD}
.int-t{font-weight:700;font-size:14px;color:var(--ink);margin-bottom:7px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
/* scadenza della lavorazione, in compilazione: badge + data, riga sottile */
.int-scad{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-3px 0 8px;font-size:11.5px;color:var(--mut)}
.int-scad-b{color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:9px;
  text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.int-scad-p{color:#B8841F;font-weight:700}
.sv-av{margin:0 0 10px}
.sv-av>label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.cp-piante{font-size:16px}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin:6px 0;cursor:pointer}
.chk input{width:18px;height:18px}
.chk2{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mut)}
.chk2 input{width:16px;height:16px}
.int-head{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.int-head input{width:18px;height:18px}
.tag{font-size:10px;font-weight:800;background:var(--gold);color:#fff;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.03em}
.int-card{border:1px solid #E3E7DD}
.sv-list{margin:6px 0}
.effgrid{display:grid;gap:7px;min-width:560px}
.effgrid .eh{font-size:10.5px;font-weight:800;color:var(--mut);text-transform:uppercase;
  letter-spacing:.02em;text-align:center;align-self:end;padding-bottom:3px;line-height:1.15}
.effgrid .es{font-size:12.5px;font-weight:700;color:var(--ink);display:flex;align-items:center}
.effgrid .tile{border-radius:10px;padding:9px 4px;text-align:center;color:#fff}
.effgrid .tile b{font-size:17px;font-weight:800;display:block;line-height:1}
.effgrid .tile span{font-size:9.5px;opacity:.9;display:block;margin-top:2px}
.effgrid .tile.nd{background:#E6E8E1!important;color:var(--mut)}
.efflegend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11.5px;color:var(--mut)}
.efflegend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
/* sopra i controlli Leaflet, che stanno a 1000 */
.modal{position:fixed;inset:0;background:rgba(20,30,18,.55);z-index:1500;
  display:flex;align-items:center;justify-content:center;padding:24px}
.modal-box{background:var(--white);border-radius:14px;padding:22px;max-width:380px;width:100%}
.modal-body{font-size:17px;color:var(--ink);line-height:1.5;margin-bottom:18px}
.modal-body b{color:var(--forest)}
.modal-act{display:flex;gap:10px}
.modal-act .btn{flex:1}
.flag-r{display:inline-block;font-size:12px;font-weight:800;background:#FADBD8;color:#C0392B;
  padding:2px 7px;border-radius:10px;margin-left:6px;white-space:nowrap}
.flag-y{display:inline-block;font-size:12px;font-weight:800;background:#FCF3CF;color:#9A6B1F;
  padding:2px 7px;border-radius:10px;margin-left:6px;white-space:nowrap}
.int-card.has-r{border-left:4px solid #C0392B}
.int-card.has-y{border-left:4px solid #E8A33D}
.int-card.appena{box-shadow:0 0 0 3px var(--moss);animation:pulse 1.6s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 3px var(--moss)}50%{box-shadow:0 0 0 7px rgba(111,168,74,.35)}100%{box-shadow:0 0 0 3px var(--moss)}}
.int-card.annull{opacity:.5}
.int-card.annull .int-head b{text-decoration:line-through}
.miss{font-size:11.5px;color:#9A6B1F;margin-top:6px}
.miss b{color:#7A5310}
.switch{display:flex;gap:0;border:1.5px solid var(--forest);border-radius:var(--r-s);overflow:hidden;margin-bottom:12px}
.switch button{flex:1;padding:10px 6px;font-size:13px;font-weight:700;background:var(--white);color:var(--forest)}
.switch button.on{background:var(--forest);color:var(--white)}
.lotto-tag{font-size:10px;font-weight:800;background:#E3E7DD;color:var(--forest-d);padding:2px 7px;
  border-radius:10px;text-transform:uppercase;letter-spacing:.03em}
.lotto-tag.urg{background:#C0392B;color:#fff}
.wrap.wide{max-width:1500px}
.gt-tools{padding:14px 16px}
.gt-tit{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.gt-ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gt-ctl select{padding:8px 10px;font-size:14px}
.gt-leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:11.5px;color:var(--mut);align-items:center}
.gt-leg span{display:inline-flex;align-items:center;gap:5px}
.lg-b{display:inline-block;position:relative;width:26px;height:11px;border:1px solid;border-radius:2px}
.lg-b i{position:absolute;left:0;top:3px;height:3px;width:55%}
.lg-s{display:inline-block;width:24px;height:5px;background:#2F3A2C}
.lg-o{display:inline-block;width:0;height:13px;border-left:2px dashed var(--ink)}
.gt-sum{cursor:pointer;font-weight:800;color:var(--forest-d);font-size:14px}
.gt-nota{font-size:11.5px;margin:6px 2px 14px}
.gp{--lw:590px;--rh:30px;position:relative;overflow:auto;max-height:calc(100vh - 250px);min-height:180px;
  border:1px solid #C9CFC2;border-radius:10px;background:#fff;margin-bottom:6px}
.gp-in{position:relative}
.gp-head{position:sticky;top:0;z-index:8;display:flex;height:44px;background:#EEF1EA;border-bottom:1px solid #B9C0B1}
.gp-lh{position:sticky;left:0;z-index:9;display:flex;align-items:flex-end;width:var(--lw);flex-shrink:0;background:#EEF1EA;border-right:2px solid #B9C0B1;
  font-size:10.5px;font-weight:800;color:var(--mut);padding-bottom:6px}
.gp-th{position:relative;flex-shrink:0;height:44px;overflow:hidden}
.gp-th .t1,.gp-th .t2{position:absolute;height:22px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;box-sizing:border-box;border-left:1px solid #D0D6C9}
.gp-th .t1{top:0;padding-left:5px;font-size:11px;font-weight:700;color:var(--ink)}
.gp-th .t2{top:22px;justify-content:center;font-size:10px;color:var(--mut);border-top:1px solid #D0D6C9}
.gp-th .t2.fest{background:#E1E5DB}
.gp-th .t-oggi{position:absolute;top:24px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;z-index:2}
.gp-body{position:relative}
.gp-bg{position:absolute;top:0;bottom:0;left:var(--lw);pointer-events:none}
.gp-bg .ln{position:absolute;top:0;bottom:0;border-left:1px solid #EEF0EA}
.gp-bg .fe{position:absolute;top:0;bottom:0;background:#F4F6F1}
.gp-bg .oggi{position:absolute;top:0;bottom:0;border-left:2px dashed var(--ink);opacity:.55}
.gp-svg{position:absolute;top:0;left:var(--lw);pointer-events:none;z-index:3;overflow:visible}
.gp-r{position:relative;display:flex;height:var(--rh);border-bottom:1px solid #EEF0EA}
.gp-l{position:sticky;left:0;z-index:5;display:flex;align-items:center;width:var(--lw);flex-shrink:0;background:#fff;border-right:2px solid #B9C0B1;font-size:12.5px}
.gp-l>div,.gp-lh>div{padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
.c-id{width:36px;flex-shrink:0;text-align:right;color:var(--mut);font-size:11px}
.c-ind{width:24px;flex-shrink:0;text-align:center;padding:0!important}
.c-nome{flex:1;min-width:0}
.c-dur{width:58px;flex-shrink:0;text-align:right}
.c-ini,.c-fin{width:70px;flex-shrink:0;text-align:right}
.c-pred{width:46px;flex-shrink:0;text-align:center}
.c-pct{width:56px;flex-shrink:0;text-align:right}
.gp-r.task .c-nome{padding-left:24px}
.gp-r.sum{cursor:pointer}
.gp-r.sum .gp-l{background:#F3F6EF;font-weight:800;color:var(--forest-d)}
.gp-r.sum .gp-t{background:#F8FAF5}
.gp-r:hover .gp-l{background:#E8F1DD}

<script>
/* Le chiavi vivono in config.js (caricato una volta, mai più toccato). */
const sb = supabase.createClient(window.HALAESA_CONFIG.url, window.HALAESA_CONFIG.key);
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = t => String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur = n => (n??0).toLocaleString("it-IT",{maximumFractionDigits:0})+" €";
const oggi = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
/* ---- date: una data è valida solo se AAAA-MM-GG, esistente e tra ANNO_MIN e ANNO_MAX ---- */
const ANNO_MIN=2020, ANNO_MAX=2040;
const dataValida = iso => {
  if(typeof iso!=="string" || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return false;
  const [a,m,g]=iso.split("-").map(Number); const u=new Date(Date.UTC(a,m-1,g));
  return a>=ANNO_MIN && a<=ANNO_MAX && u.getUTCMonth()===m-1 && u.getUTCDate()===g;
};
const DATA_ATTR = `min="${ANNO_MIN}-01-01" max="${ANNO_MAX}-12-31"`;
// una data illeggibile non deve bloccare le viste: la tolgo dai calcoli e ricordo il valore originale
function pulisciDate(obj, campi){
  for(const c of campi){
    const v=obj[c];
    if(v!==null && v!==undefined && v!=="" && !dataValida(v)){ obj["_err_"+c]=v; obj[c]=null; }
  }
  return obj;
}
// controllo prima del salvataggio: evidenzia i campi errati e restituisce l'elenco
function dateErrate(inputs){
  const bad=[];
  for(const el of inputs){ if(!el) continue; el.classList.remove("bad");
    if(el.value!=="" && !dataValida(el.value)){ el.classList.add("bad"); bad.push(el); } }
  return bad;
}
let P = null;          // profilo: {id,nome,ruolo,super_user,sito_id,email}
const isSuper = () => !!P?.super_user;
const isReadOnly = () => !!P?.sola_lettura;
let DB = {};           // anagrafiche in cache: siti, attivita, operai, macchine, terzisti
const FASCE = [25,50,75,100];

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}
function err(sel,m){const e=$(sel);e.textContent=m;e.style.display="block"}

/* ---------------- AUTH ---------------- */
$("#l-go").onclick = async () => {
  $("#login-err").style.display="none";
  const {error} = await sb.auth.signInWithPassword({email:$("#l-email").value.trim(),password:$("#l-pass").value});
  if(error){err("#login-err","Credenziali non valide.");return}
  start();
};
$("#logout").onclick = async e => {e.preventDefault(); await sb.auth.signOut(); location.reload()};

async function start(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){$("#v-login").classList.remove("hide");$("#v-app").classList.add("hide");return}
  const {data:prof} = await sb.from("profili").select("*").eq("id",session.user.id).single();
  if(!prof){err("#login-err","Utente senza profilo: contattare la direzione.");await sb.auth.signOut();return}
  P = prof;
  // anagrafiche + lista master della gerarchia (categorie/interventi)
  const [si,ca,inv,op,ma,pa,cr,pz,lo,co,ps] = await Promise.all([
    sb.from("siti").select("*").order("id"),
    sb.from("categorie").select("*").order("ordine"),
    sb.from("interventi").select("*").order("ordine"),
    sb.from("operai").select("*").eq("attivo",true).order("nome"),
    sb.from("macchine").select("*").eq("attivo",true).order("nome"),
    sb.from("parametri").select("*"),
    sb.from("causali_ritardo").select("*").order("ordine"),
    sb.from("categorie_perizia").select("*").order("ordine"),
    sb.from("lotti").select("*").order("ordine"),
    sb.from("comuni").select("*").order("ordine"),
    sb.from("profili_siti").select("sito_id").eq("profilo_id",prof.id),
  ]);
  DB = {siti:si.data||[], categorie:ca.data||[], interventi:inv.data||[],
        operai:op.data||[], macchine:ma.data||[], causali:cr.data||[], perizie:pz.data||[], lotti:lo.data||[], comuni:co.data||[],
        par:Object.fromEntries((pa.data||[]).map(p=>[p.chiave,+p.valore]))};
  DB.mieiSitiIds = (ps.data||[]).map(x=>x.sito_id);
  DB.siti.forEach(x=>pulisciDate(x,["data_avvio"]));
  $("#v-login").classList.add("hide");$("#v-app").classList.remove("hide");
  $("#who-nome").textContent = P.nome;
  const sitoNome = DB.siti.find(s=>s.id===P.sito_id)?.nome || "Tutti i siti";
  $("#who-ruolo").textContent = P.ruolo + " · " + sitoNome;
  buildTabs(); show((isSuper()||isReadOnly()) ? "dash" : "compila");
}

/* ---------------- TABS / ROUTING ---------------- */
const TABS = {
  compila:{ic:"📝",l:"Lavori",who:p=>!isReadOnly()},
  ore:{ic:"⏱️",l:"Ore",who:p=>!isReadOnly()},
  macchine:{ic:"🚜",l:"Macchine",who:p=>!isReadOnly()},
  carburanti:{ic:"⛽",l:"Carburanti",who:p=>!isReadOnly()},
  sito:{ic:"📍",l:"Il mio sito",who:p=>!isReadOnly()&&!isSuper()&&p.sito_id},
  gantt:{ic:"📅",l:"Gantt",who:p=>true},
  dash:{ic:"📊",l:"Dashboard",who:p=>isSuper()||isReadOnly()},
  setup:{ic:"⚙️",l:"Setup",who:p=>isSuper()&&!isReadOnly()},
};
function buildTabs(){
  $("#tabs").innerHTML = Object.entries(TABS)
    .filter(([k,t])=>t.who(P))
    .map(([k,t])=>`<button class="tab" data-t="${k}"><span class="ic">${t.ic}</span>${t.l}</button>`).join("");
  $$(".tab").forEach(b=>b.onclick=()=>show(b.dataset.t));
}
async function show(k){
  if(CURRENT_TAB==="setup" && k!=="setup") await setupAutoSalva();
  CURRENT_TAB=k;
  $$(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===k));
  ["compila","ore","macchine","carburanti","sito","gantt","dash","setup"].forEach(p=>$("#pane-"+p).classList.toggle("hide",p!==k));
  $(".wrap").classList.toggle("wide",k==="gantt");
  $(".wrap").classList.toggle("dashw",k==="dash");
  renderSitoBar(k==="compila"||k==="carburanti"||k==="ore"||k==="macchine");
  ({compila:rCompila,ore:rOre,macchine:rMacchine,carburanti:rCarburanti,sito:rSito,gantt:rGantt,dash:rDash,setup:rSetup})[k]();
}

/* ---------------- MOTORE COSTI (logica validata) ----------------
   - % discreta: ultimo valore (limite alto fascia)
   - Piantumazione: piante cumulative (ultimo valore) / previste
   - materiali = Σ importi attività × frazione avanzamento
   - ore uomo = ore × tariffa; macchine = presenza × tariffa/g
   - carburanti = litri gasolio × prezzo + litri benzina × prezzo
   - ha completati = ettari_totali × Σ(peso × %)/10000           */
/* ---------------- DATI PER SITO + MOTORE COSTI GERARCHICO (Blocco 2) ---------------- */
async function datiSito(sito_id){
  const q = t => sb.from(t).select("*").eq("sito_id",sito_id);
  const [si_int, sc, av, ap, ou, mg, ga, ri, sa] = await Promise.all([
    q("sito_interventi"), q("sito_categorie"),
    q("avanzamenti"), q("avanz_piante"), q("ore_uomo"),
    q("macchine_giorno"), q("carburanti"), q("ritardi"),
    sb.from("sotto_aree").select("*").eq("sito_id",sito_id).order("ordine"),
  ]);
  const siIds = (si_int.data||[]).map(x=>x.id);
  let sv = [];
  if(siIds.length){
    const r = await sb.from("sottovoci").select("*").in("sito_intervento_id",siIds).order("ordine");
    sv = r.data||[];
  }
  (si_int.data||[]).forEach(x=>pulisciDate(x,["scadenza","data_inizio"]));
  return {sito_interventi:si_int.data||[], sito_categorie:sc.data||[], sottovoci:sv,
          sotto_aree:(sa.data||[]).slice().sort((a,b)=>(a.ordine-b.ordine)||String(a.nome).localeCompare(String(b.nome),"it")),
          avanzamenti:av.data||[], avanz_piante:ap.data||[], ore_uomo:ou.data||[],
          macchine_giorno:mg.data||[], carburanti:ga.data||[], ritardi:ri.data||[]};
}
const MAXV = arr => arr.length ? Math.max(...arr) : 0;
/* ---- dati mancanti (cartello giallo) e bandierina rossa ---- */
const VUOTO = v => v===null || v===undefined || v==="";
function mancanti(si, intv){
  if(si.annullato) return [];
  const m=[];
  if(intv.tipo==="piante"){
    if(VUOTO(si.piante_previste)) m.push("piante previste");
    if(VUOTO(si.costo_unitario))  m.push("costo per pianta");
  } else {
    if(VUOTO(si.budget)) m.push("budget");
    if(VUOTO(si.costo_unitario_voce)) m.push("costo unitario");
    if(VUOTO(si.unita_misura)) m.push("unità di misura");
    if(VUOTO(si.quantita))     m.push("quantità");
  }
  const errata = c => si["_err_"+c] || (!VUOTO(si[c]) && !dataValida(si[c]));
  if(VUOTO(si.durata_giorni))m.push("durata");
  if(!si.dipende_da){ if(errata("data_inizio")) m.push("data inizio non valida"); else if(VUOTO(si.data_inizio)) m.push("data inizio"); }
  if(si.modalita==="da_definire") m.push("modalità");
  if(errata("scadenza")) m.push("scadenza non valida"); else if(VUOTO(si.scadenza)) m.push("scadenza");
  return m;
}
/* ---- pianificazione: risolve la catena delle dipendenze ---- */
const DAY=86400000;
const toD = iso => { if(!iso) return null; const d=new Date(iso+"T00:00:00Z"); return isNaN(d)?null:d; };
const toIso = d => (d && !isNaN(d)) ? d.toISOString().slice(0,10) : null;
const addGG = (iso,n) => { const d=toD(iso); if(!d || !isFinite(n)) return null; d.setUTCDate(d.getUTCDate()+n); return toIso(d); };
const diffGG = (a,b) => { const x=toD(a), y=toD(b); return (x&&y) ? Math.round((x-y)/DAY) : NaN; };

// per ogni riga: inizio effettivo, fine, ritardo sulla scadenza, catena e anelli
function pianifica(righe){
  const byId=new Map(righe.map(r=>[r.id,r]));
  const out=new Map();
  function calc(r,visti){
    if(out.has(r.id)) return out.get(r.id);
    if(visti.has(r.id)){ const c={ciclo:true}; out.set(r.id,c); return c; }
    visti.add(r.id);
    const durata = r.durata_giorni==null ? null : +r.durata_giorni;
    let inizio = r.data_inizio || null, pred=null, predMancante=false;
    if(r.dipende_da){
      pred = byId.get(r.dipende_da);
      if(!pred || pred.annullato){ predMancante=true; }
      else {
        const p=calc(pred,visti);
        if(p.ciclo){ const c={ciclo:true}; out.set(r.id,c); return c; }
        // la data inserita a mano vince; il predecessore la calcola solo se manca
        if(p.fine && !r.data_inizio) inizio = addGG(p.fine,1);
      }
    }
    const fine = (inizio && durata) ? addGG(inizio, durata-1) : null;
    const res = {inizio, fine, durata, predMancante,
      predNome: pred ? (DB.interventi.find(i=>i.id===pred.intervento_id)||{}).nome : null,
      ritardo: (fine && r.scadenza) ? diffGG(fine, r.scadenza) : null, ciclo:false};
    out.set(r.id,res); return res;
  }
  righe.forEach(r=>calc(r,new Set()));
  return out;
}
// verifica se collegare figlio -> padre crea un anello
function creaCiclo(righe, figlioId, padreId){
  const byId=new Map(righe.map(r=>[r.id,r]));
  let cur=byId.get(padreId), n=0;
  while(cur && n++<200){
    if(cur.id===figlioId) return true;
    cur = cur.dipende_da ? byId.get(cur.dipende_da) : null;
  }
  return false;
}
// stato di una riga pianificata rispetto alla scadenza e all'avanzamento
function statoGantt(p, avz, scadenza, oggiStr){
  if(p.ciclo) return {k:"ciclo", l:"dipendenza circolare", c:"#8E2820"};
  if(!p.durata) return {k:"nodurata", l:"durata da inserire", c:"#6B7565"};
  if(avz>=1) return {k:"fatto", l:"completato", c:"#8CBF66"};
  if(!scadenza) return {k:"noscad", l:"scadenza da inserire", c:"#6B7565"};
  const disp = diffGG(scadenza, oggiStr);
  const residua = Math.ceil(p.durata*(1-avz));
  if(p.inizio && diffGG(scadenza,p.inizio)+1 < p.durata)
    return {k:"impossibile", l:"non ci sta", c:"#8E2820", disp, residua, scoperto:residua-disp};
  if(residua > disp) return {k:"tardi", l:"in ritardo", c:"#C0392B", disp, residua, scoperto:residua-disp};
  if(disp>0 && (disp-residua)/disp < 0.2) return {k:"stretto", l:"margine stretto", c:"#E8A33D", disp, residua};
  return {k:"ok", l:"in tempo", c:"#1F5C2E", disp, residua};
}

const budgetEffDi = (si,intv) => intv.tipo==="piante"
  ? (+si.piante_previste||0)*(+si.costo_unitario||0) : (+si.budget||0);

function calcSito(sito_id, D){
  const sito = DB.siti.find(s=>s.id===sito_id) || {};
  const prezzoGasolio = DB.par?.prezzo_gasolio || 0;
  const prezzoBenzina = DB.par?.prezzo_benzina || 0;
  const tariffaOp = id => (DB.operai.find(o=>o.id===id)||{}).tariffa_ora || 0;
  const tariffaMa = id => (DB.macchine.find(m=>m.id===id)||{}).tariffa_giorno || 0;
  const attivi = D.sito_interventi.filter(si=>si.attivo && !si.annullato);
  // ---- INTERVENTO ----
  const perInt = attivi.map(si=>{
    const intv = DB.interventi.find(i=>i.id===si.intervento_id) || {};
    let avz=0;
    const budgetEff = budgetEffDi(si,intv);
    // lavorazione divisa per sotto-area solo se il sito ne ha davvero;
    // altrimenti ricade sul comportamento di sempre (livello sito).
    const aree = D.sotto_aree||[];
    const perArea = !!si.per_sotto_area && aree.length>0;
    if(intv.tipo==="piante"){
      const prev=+si.piante_previste||0;
      const pianteIn = sa => MAXV(D.avanz_piante
        .filter(a=>a.sito_intervento_id===si.id && (a.sotto_area_id??null)===sa).map(a=>+a.piante||0));
      // le piante sono un conteggio, non una percentuale: fra sotto-aree si SOMMANO
      const messe = perArea ? aree.reduce((s,sa)=>s+pianteIn(sa.id),0) : pianteIn(null);
      avz = prev>0?Math.min(messe/prev,1):0;
    } else if(perArea){
      // pesata sugli ettari: 20 ha di sotto-area contano il doppio di 10.
      // Misura quanto terreno e' stato lavorato, non quanto tempo e' costato.
      // Se le superfici non ci sono ancora, si ripiega su pesi uguali.
      const pctIn = sa => MAXV(D.avanzamenti
        .filter(a=>a.sito_intervento_id===si.id && a.sotto_area_id===sa.id).map(a=>+a.pct||0))/100;
      const haTot = aree.reduce((s,sa)=>s+(+sa.ettari||0),0);
      avz = haTot>0
        ? aree.reduce((s,sa)=>s+(+sa.ettari||0)*pctIn(sa),0)/haTot
        : aree.reduce((s,sa)=>s+pctIn(sa),0)/aree.length;
    } else {
      const svs=D.sottovoci.filter(sv=>sv.sito_intervento_id===si.id);
      if(svs.length){
        let sum=0;
        for(const sv of svs) sum += MAXV(D.avanzamenti.filter(a=>a.sottovoce_id===sv.id).map(a=>+a.pct||0))/100;
        avz=sum/svs.length;
      } else {
        avz = MAXV(D.avanzamenti.filter(a=>a.sito_intervento_id===si.id && !a.sotto_area_id).map(a=>+a.pct||0))/100;
      }
    }
    const costoBudget=budgetEff*avz;
    const ore=D.ore_uomo.filter(o=>o.sito_intervento_id===si.id)
                .reduce((s,o)=>s+(+o.ore||0)*tariffaOp(o.operaio_id),0);
    return {si_id:si.id,intervento_id:si.intervento_id,categoria_id:intv.categoria_id,
            perizia_id:intv.categoria_perizia_id, lotto:si.lotto||"Intero sito",
            nome:intv.nome,modalita:si.modalita,tipo:intv.tipo,avz,budgetEff,costoBudget,ore,
            costoInt:costoBudget+ore, mancanti:mancanti(si,intv), daVerificare:!!si.da_verificare,
            nota:si.nota_verifica, priorita:si.priorita};
  });
  // ---- aggregazione generica pesata sul budget (fallback: media semplice) ----
  function aggrega(items,chiave){
    const m={};
    for(const p of items){
      const k=p[chiave]??0;
      (m[k]=m[k]||{sum:0,n:0,b:0,bs:0}).sum+=p.avz; m[k].n++;
      m[k].b+=p.budgetEff; m[k].bs+=p.budgetEff*p.avz;
    }
    return Object.entries(m).map(([k,v])=>({id:+k,
      avz: v.b>0 ? v.bs/v.b : (v.n?v.sum/v.n:0), nInt:v.n, budget:v.b}));
  }
  const perCat = aggrega(perInt,"categoria_id").map(x=>({categoria_id:x.id,...x}));
  const perPz  = aggrega(perInt,"perizia_id").map(x=>({perizia_id:x.id,...x}));
  // ---- SITO: pesato sui budget; se non ci sono budget, pesi di categoria ----
  const budTot = perInt.reduce((s,p)=>s+p.budgetEff,0);
  let avz, pesoTot=0, avzPesato=0;
  if(budTot>0){
    avz = perInt.reduce((s,p)=>s+p.budgetEff*p.avz,0)/budTot;
  } else {
    for(const c of perCat){
      const w=(D.sito_categorie.find(x=>x.categoria_id===c.categoria_id)||{}).peso_pct||0;
      avzPesato+=(w/100)*c.avz; pesoTot+=w/100;
    }
    avz = pesoTot>0?avzPesato/pesoTot:0;
  }
  const ettari=(+sito.ettari_totali||0)*avz;
  // ---- COSTI ----
  let bIn=0,bTe=0,cIn=0,cTe=0,ore=0;
  for(const p of perInt){
    if(p.modalita==="conto_terzi"){bTe+=p.budgetEff;cTe+=p.costoBudget;}
    else{bIn+=p.budgetEff;cIn+=p.costoBudget;}
    ore+=p.ore;
  }
  const macchine=D.macchine_giorno.filter(m=>m.presente).reduce((s,m)=>s+tariffaMa(m.macchina_id),0);
  // i due carburanti hanno prezzi diversi: si valorizzano riga per riga
  const carburanti=D.carburanti.reduce((s,g)=>
    s+(+g.litri_gasolio||0)*prezzoGasolio+(+g.litri_benzina||0)*prezzoBenzina,0);
  const gg_fermo=D.ritardi.reduce((s,r)=>s+(+r.giorni||0),0);
  const interno=cIn+ore+macchine+carburanti, terzisti=cTe, totale=interno+terzisti, budgetTot=bIn+bTe;
  // ---- segnalazioni ----
  const nMancanti = perInt.filter(p=>p.mancanti.length).length + (VUOTO(sito.ettari_totali)?1:0);
  const nRosse    = perInt.filter(p=>p.daVerificare).length;
  const lotti     = [...new Set(D.sito_interventi.filter(x=>x.attivo&&!x.annullato).map(x=>x.lotto||"Intero sito"))];
  return {avz,avzPesato,pesoTot,ettari,perInt,perCat,perPz,gg_fermo,nMancanti,nRosse,lotti,budTot,
    ettariMancanti:VUOTO(sito.ettari_totali),
    costi:{costoMatInhouse:cIn,costoMatTerzi:cTe,ore,macchine,carburanti,interno,terzisti,totale,budgetTot,budgetInhouse:bIn,budgetTerzi:bTe}};
}

/* ---- Scadenze / gantt a scadenze ---- */
function statoScadenza(avvio, scadenza, oggiStr, avz, prorogaGiorni){
  if(avz>=1) return {stato:"completato", proroga:prorogaGiorni||0};
  if(!scadenza) return {stato:"nd"};
  const D=d=>new Date(d+"T00:00:00Z"), gg=(a,b)=>Math.round((D(a)-D(b))/86400000);
  const addgg=(d,n)=>{const x=D(d);x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10);};
  const P=prorogaGiorni||0;
  const scadEff = P>0 ? addgg(scadenza,P) : scadenza;
  const rim=gg(scadEff,oggiStr);
  let stato, frac=null;
  if(rim<0) stato="scaduto";
  else if(!avvio) stato="nd_tempo";
  else { const tot=gg(scadEff,avvio); frac=tot>0?rim/tot:0;
    stato = frac<=0.05?"5": frac<=0.10?"10": frac<=0.20?"20":"ok"; }
  // scostamento reale (forecast lineare): giorni oltre/sotto la scadenza rettificata
  let scostamento=null;
  if(avvio && avz>0 && avz<1){
    const elapsed=gg(oggiStr,avvio);
    if(elapsed>0){ const totForecast=elapsed/avz, totEff=gg(scadEff,avvio);
      scostamento=Math.round(totForecast-totEff); }
  }
  return {stato, rim, ritardoGiorni:rim<0?-rim:0, frac, scadEff, proroga:P, scostamento};
}
const STATI = {
  scaduto:{l:"SCADUTO",c:"#8E2820"}, "5":{l:"≤5% tempo",c:"#C0392B"},
  "10":{l:"≤10% tempo",c:"#E07B39"}, "20":{l:"≤20% tempo",c:"#E8A33D"},
  ok:{l:"in tempo",c:"#1F5C2E"}, completato:{l:"completato",c:"#8CBF66"},
  nd_tempo:{l:"manca avvio sito",c:"#6B7565"}, nd:{l:"—",c:"#9aa39a"}
};
/* ---- scadenza in compilazione: al FM serve sapere quanto tempo resta,

function chipScadenza(si, st){
  const riga = (b,c,meta) => `<div class="int-scad">
    <span class="int-scad-b" style="background:${c}">${b}</span>${meta||""}</div>`;
  if(si._err_scadenza)
    return riga("scadenza da correggere","#C0392B",
      `<span>data non valida (${esc(si._err_scadenza)}): segnalalo al PM</span>`);
  if(st.stato==="nd") return `<div class="int-scad">scadenza non ancora definita</div>`;
  const col=(STATI[st.stato]||STATI.nd).c;
  // "manca avvio sito" non dice nulla a chi compila: conta comunque i giorni
  const quando = st.stato==="completato" ? "completato"
    : st.rim<0  ? `scaduto da ${-st.rim} ${-st.rim===1?"giorno":"giorni"}`
    : st.rim===0 ? "scade oggi"
    : `tra ${st.rim} ${st.rim===1?"giorno":"giorni"}`;
  const pror = st.proroga>0 ? ` <span class="int-scad-p">+${st.proroga} gg proroga</span>` : "";
  return riga(quando, col, `<span>scad. ${dataIt(st.scadEff||si.scadenza)}${pror}</span>`);
}
function scadenzeSito(sitoId, D, R){
  const avvio=(DB.siti.find(s=>s.id===sitoId)||{}).data_avvio;
  const ord={scaduto:0,"5":1,"10":2,"20":3,nd_tempo:4,ok:5,completato:6,nd:7};
  const items=[];
  for(const si of D.sito_interventi.filter(x=>x.attivo)){
    const intv=DB.interventi.find(i=>i.id===si.intervento_id)||{};
    const p=R.perInt.find(x=>x.si_id===si.id)||{avz:0};
    const rit=D.ritardi.filter(r=>r.sito_intervento_id===si.id);
    const proroga=rit.filter(r=>r.forza_maggiore && !r.proroga_revocata).reduce((s,r)=>s+(+r.giorni||0),0);
    const ritFM=rit.filter(r=>r.forza_maggiore);
    const ritImput=rit.filter(r=>!r.forza_maggiore);
    const st=statoScadenza(avvio, si.scadenza, oggi(), p.avz, proroga);
    items.push(Object.assign({nome:intv.nome, categoria:catNome(intv.categoria_id), avz:p.avz,
      perizia:(DB.perizie.find(x=>x.id===intv.categoria_perizia_id)||{}).nome,
      lotto:si.lotto||"Intero sito", scadenza:si.scadenza, ritardi:rit, ritFM, ritImput}, st));
  }
  items.sort((a,b)=>(ord[a.stato]-ord[b.stato])||((a.rim??1e9)-(b.rim??1e9)));
  return items;
}
function rigaScadenza(i, consentiRevoca){
    const dIt=iso=>{const[a,m,g]=iso.split("-");return `${g}/${m}/${a}`;};
    const st=STATI[i.stato]||STATI.nd;
    const elapsed=(i.frac!=null)?Math.min(Math.max(1-i.frac,0),1):(i.stato==="scaduto"?1:0);
    const tempo = i.stato==="scaduto"?`scaduto da ${i.ritardoGiorni} gg`
               : i.stato==="completato"?"completato"
               : i.rim!=null?`tra ${i.rim} gg`:"";
    const pror = i.proroga>0 ? ` · <span style="color:#B8841F">+${i.proroga}gg proroga → ${dIt(i.scadEff)}</span>` : "";
    const sco = i.scostamento;
    const scoTxt = sco==null ? "" :
      sco>2 ? `<span class="sco sco-bad">ritardo reale stimato +${sco} gg</span>` :
      sco<-2 ? `<span class="sco sco-ok">margine stimato ${-sco} gg</span>` :
               `<span class="sco">in linea col passo</span>`;
    const ritFM=i.ritFM||[];
    const ritImp=i.ritImput||[];
    let ritHtml="";
    if(ritFM.length){
      const voci=ritFM.map(r=>{
        const rev=r.proroga_revocata;
        const btn=consentiRevoca?`<button class="rev-btn" onclick="revocaProroga(${r.id},${rev?'false':'true'})">${rev?'ripristina':'revoca'}</button>`:'';
        return `<div class="fm-item${rev?' fm-rev':''}"><span>${esc(r.causa||'forza maggiore')} · ${r.giorni} gg${rev?' — proroga revocata':''}</span>${btn}</div>`;
      }).join("");
      ritHtml+=`<div class="rit-note rit-fm">↪ Proroga forza maggiore attiva: ${i.proroga} gg<div class="fm-list">${voci}</div></div>`;
    }
    if(ritImp.length){ const g=ritImp.reduce((s,r)=>s+(+r.giorni||0),0);
      const cs=[...new Set(ritImp.map(r=>r.causa).filter(Boolean))].join(", ");
      ritHtml+=`<div class="rit-note">⚠ Ritardo imputabile: ${g} gg${cs?` — ${esc(cs)}`:''}</div>`; }
    return `<div class="scad-row">
      <div class="scad-top">
        <span class="scad-nome">${esc(i.nome)}${i.sito?` <span class="muted">· ${esc(i.sito)}</span>`:''}${i.lotto&&i.lotto!=="Intero sito"?` <span class="lotto-tag urg">${esc(i.lotto)}</span>`:''}</span>
        <span class="scad-badge" style="background:${st.c}">${st.l}</span></div>
      <div class="scad-meta"><span class="muted">${esc(i.categoria)}</span>
        <span>Avanz. ${Math.round(i.avz*100)}% · scad. ${i.scadenza?dIt(i.scadenza):"—"}${pror}${tempo?" · "+tempo:""}</span></div>
      <div class="scad-bar"><i class="scad-fill" style="width:${Math.round(i.avz*100)}%"></i>
        ${(i.frac!=null||i.stato==="scaduto")?`<span class="scad-today" style="left:${Math.round(elapsed*100)}%"></span>`:''}</div>
      ${scoTxt?`<div class="scad-sco">${scoTxt}</div>`:''}
      ${ritHtml}</div>`;
}

/* ---- scadenze raggruppate (sito / categoria perizia) ---- */
let SC_GRUPPO="sito", SC_LOTTO="";
window.setScad = (k,v) => { if(k==="g") SC_GRUPPO=v; else SC_LOTTO=v; rDash(); };

function renderScadenzeRaggruppate(items, consentiRevoca){
  let vis = SC_LOTTO ? items.filter(i=>(i.lotto||"Intero sito")===SC_LOTTO) : items;
  const lotti=[...new Set(items.map(i=>i.lotto||"Intero sito"))].sort();
  const conScad = vis.filter(i=>i.stato!=="nd");
  const senza   = vis.filter(i=>i.stato==="nd");
  const urgenti = conScad.filter(i=>["scaduto","5","10","20"].includes(i.stato));
  const ordS={scaduto:0,"5":1,"10":2,"20":3,nd_tempo:4,ok:5,completato:6,nd:7};
  urgenti.sort((a,b)=>(ordS[a.stato]-ordS[b.stato])||((a.rim??1e9)-(b.rim??1e9)));
  const chiave = i => SC_GRUPPO==="perizia" ? (i.perizia||"non classificato") : (i.sito||"—");
  const gruppi={};
  conScad.forEach(i=>(gruppi[chiave(i)]=gruppi[chiave(i)]||[]).push(i));

let GT_GRUPPO="sito", GT_LOTTO="", GT_SCALA="auto", GT_RIGHE=null, GT_MOD=null;
const GT_CHIUSI=new Set();
window.setGantt = (k,v) => { if(k==="g") GT_GRUPPO=v; else if(k==="l") GT_LOTTO=v; else if(k==="s") GT_SCALA=v; disegnaGantt(); };
window.gtToggle = k => { GT_CHIUSI.has(k)?GT_CHIUSI.delete(k):GT_CHIUSI.add(k); disegnaGantt(true); };
const GT_CRIT=["impossibile","tardi","ciclo"];
const GT_COL={ok:"#3F7F3A",stretto:"#D8912A",tardi:"#C0392B",impossibile:"#8E2820",ciclo:"#8E2820",fatto:"#8CBF66",noscad:"#7F8A7A",nodurata:"#7F8A7A"};
const MESI=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const MESI_L=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const gtData = iso => { if(!iso) return ""; const[a,m,g]=iso.split("-"); return `${g}/${m}/${a.slice(2)}`; };
const gtLun = iso => addGG(iso, -((toD(iso).getUTCDay()+6)%7));
const gtFineMese = iso => { const a=+iso.slice(0,4), m=+iso.slice(5,7); return toIso(new Date(Date.UTC(a,m,0))); };
const gtHexA = (hex,a) => hex+Math.round(a*255).toString(16).padStart(2,"0");
function gtAllarme(r){
  const st=r.st, p=r.p;
  if(r.si._err_scadenza) return `Scadenza non valida (${r.si._err_scadenza}): correggila nel Setup`;
  if(st.k==="impossibile") return `Finisce il ${gtData(p.fine)}, ${p.ritardo} ${p.ritardo===1?"giorno":"giorni"} dopo la scadenza`;
  if(st.k==="tardi")  return st.disp<0
    ? `Scadenza superata da ${-st.disp} ${st.disp===-1?"giorno":"giorni"}, servono ancora ${st.residua} gg`
    : `Servono ancora ${st.residua} gg, ne restano ${st.disp}: ${st.scoperto} ${st.scoperto===1?"giorno":"giorni"} di scoperto`;
  if(st.k==="stretto")return `Margine stretto: ${st.residua} gg necessari su ${st.disp} disponibili`;
  if(st.k==="ciclo")  return `Dipendenza circolare: correggila nel Setup`;
  if(st.k==="noscad") return `Scadenza da inserire`;
  return "";
}

async function rGantt(){
  if(!GT_RIGHE) $("#pane-gantt").innerHTML=`<div class="card"><p class="muted">Carico il Gantt…</p></div>`;
  const siti = isSuper()||isReadOnly() ? DB.siti : DB.siti.filter(x=>x.id===P.sito_id);
  const dati=[];
  for(const s of siti){ const D=await datiSito(s.id); dati.push({sito:s,D,R:calcSito(s.id,D)}); }
  const oggiStr=oggi(), righe=[], lotti=new Set();
  for(const {sito,D,R} of dati){
    const attive=D.sito_interventi.filter(x=>x.attivo&&!x.annullato);
    const plan=pianifica(attive);
    for(const si of attive){
      const intv=DB.interventi.find(i=>i.id===si.intervento_id)||{};
      const p=plan.get(si.id)||{};
      const avz=(R.perInt.find(x=>x.si_id===si.id)||{avz:0}).avz;
      lotti.add(si.lotto||"Intero sito");
      righe.push({si,intv,sito,p,avz,lotto:si.lotto||"Intero sito",st:statoGantt(p,avz,si.scadenza,oggiStr)});
    }
  }
  GT_RIGHE={righe,lotti};
  disegnaGantt();
}

function modelloGantt(){
  const oggiStr=oggi();
  let righe=GT_RIGHE.righe; if(GT_LOTTO) righe=righe.filter(r=>r.lotto===GT_LOTTO);
  const pian=righe.filter(r=>r.p.inizio && r.p.fine);
  const senza=righe.filter(r=>!(r.p.inizio && r.p.fine));
  const perizia = r => DB.perizie.find(x=>x.id===r.intv.categoria_perizia_id);
  const chiave = r => GT_GRUPPO==="perizia" ? ((perizia(r)||{}).nome||"Non classificato") : nomeSito(r.sito);
  const ordine = r => GT_GRUPPO==="perizia" ? ((perizia(r)||{}).ordine ?? 999) : r.sito.id;
  const gm=new Map();
  for(const r of pian){ const k=chiave(r); if(!gm.has(k)) gm.set(k,{nome:k,ord:ordine(r),righe:[]}); gm.get(k).righe.push(r); }
  const gruppi=[...gm.values()].sort((a,b)=>(a.ord-b.ord)||a.nome.localeCompare(b.nome));
  let id=0;
  for(const g of gruppi){
    g.righe.sort((a,b)=>a.p.inizio.localeCompare(b.p.inizio)||String(a.intv.nome).localeCompare(String(b.intv.nome)));
    g.id=++id;
    g.inizio=g.righe.map(r=>r.p.inizio).reduce((a,b)=>a<b?a:b);
    g.fine=g.righe.map(r=>r.p.fine).reduce((a,b)=>a>b?a:b);
    const dt=g.righe.reduce((s,r)=>s+(+r.p.durata||0),0);
    g.avz=dt? g.righe.reduce((s,r)=>s+(+r.p.durata||0)*r.avz,0)/dt : 0;
    g.nAl=g.righe.filter(r=>GT_CRIT.includes(r.st.k)).length;
    for(const r of g.righe) r.id=++id;
  }
  const idDi=new Map(pian.map(r=>[r.si.id,r]));
  // finestra temporale e scala
  const dts=[oggiStr,...pian.flatMap(r=>[r.p.inizio,r.p.fine,r.si.scadenza])].filter(d=>d&&toD(d));
  let t0=dts.reduce((a,b)=>a<b?a:b), t1=dts.reduce((a,b)=>a>b?a:b);
  const spanGrezzo=diffGG(t1,t0)+1;
  const scala = GT_SCALA!=="auto" ? GT_SCALA : spanGrezzo<=50?"giorni" : spanGrezzo<=330?"settimane":"mesi";
  if(scala==="giorni"){ t0=gtLun(addGG(t0,-2)); t1=addGG(gtLun(addGG(t1,3)),6); }
  else if(scala==="settimane"){ t0=gtLun(addGG(t0,-3)); t1=addGG(gtLun(addGG(t1,10)),6); }
  else { t0=t0.slice(0,8)+"01"; t1=gtFineMese(addGG(gtFineMese(t1),1)); }
  const pxg={giorni:26,settimane:6,mesi:3.4}[scala];
  const nGiorni=diffGG(t1,t0)+1, W=Math.round(nGiorni*pxg);
  // unità della scala: basso (celle) e alto (intestazione)
  const kB = iso => scala==="giorni"?iso : scala==="settimane"?gtLun(iso) : iso.slice(0,7);
  const kA = iso => scala==="giorni"?gtLun(iso) : scala==="settimane"?iso.slice(0,7) : iso.slice(0,4);
  const basso=[], alto=[];
  for(let i=0,d=t0;i<nGiorni;i++,d=addGG(d,1)){
    const b=basso[basso.length-1], a=alto[alto.length-1];
    if(!b||b.k!==kB(d)) basso.push({k:kB(d),a:d,gg:0,fest:[0,6].includes(toD(d).getUTCDay())}); basso[basso.length-1].gg++;
    if(!a||a.k!==kA(d)) alto.push({k:kA(d),a:d,gg:0}); alto[alto.length-1].gg++;
  }
  basso.forEach(u=>{ const [y,m,g]=u.a.split("-"); u.b=addGG(u.a,u.gg);
    u.l = scala==="mesi" ? MESI[+m-1] : String(+g); });
  alto.forEach(u=>{ const [y,m,g]=u.a.split("-");
    u.l = scala==="giorni" ? `${+g} ${MESI[+m-1]} '${y.slice(2)}` : scala==="settimane" ? `${MESI_L[+m-1]} ${y}` : y; });
  return {oggiStr,righe,pian,senza,gruppi,idDi,t0,t1,scala,pxg,W,basso,alto,
          x: iso => diffGG(iso,t0)*pxg};
}

function disegnaGantt(mantieniScroll){

    if(GT_CRIT.includes(r.st.k)||r.si._err_scadenza) return `<span class="gi gi-r" title="${t}">!</span>`;

  const righeHtml = vis.map(v=>{

          <div class="c-pct">${Math.round(g.avz*100)}%</div></div>
        <div class="gp-t" style="width:${M.W}px"><div class="gs" style="left:${x}px;width:${w}px"></div></div></div>`;
    }
    const r=v.r, c=GT_COL[r.st.k]||GT_COL.ok;
    const x=M.x(r.p.inizio), w=Math.max(M.x(r.p.fine)+M.pxg-x,3), pct=Math.round(r.avz*100);
    const pred=r.si.dipende_da ? M.idDi.get(r.si.dipende_da) : null;
    const predTxt = pred ? String(pred.id) : (r.si.dipende_da ? `<span title="${esc(r.p.predNome||"predecessore fuori vista")}">↗</span>` : "");
    const al=gtAllarme(r);
    const tip=esc(`${r.intv.nome} · ${nomeSito(r.sito)}\n${r.p.durata} gg · ${gtData(r.p.inizio)} → ${gtData(r.p.fine)}${r.si.scadenza?` · scadenza ${gtData(r.si.scadenza)}`:""}\nAvanzamento ${pct}% · ${r.st.l}${r.lotto!=="Intero sito"?" · "+r.lotto:""}${al?"\n"+al:""}`);
    const scad = r.si.scadenza && toD(r.si.scadenza) ? `<span class="gdl" style="left:${M.x(r.si.scadenza)+M.pxg}px" title="Scadenza ${gtData(r.si.scadenza)}">▼</span>` : "";
    return `<div class="gp-r task">
      <div class="gp-l"><div class="c-id">${r.id}</div><div class="c-ind">${cellaInd(r)}</div>
        <div class="c-nome" title="${tip}">${esc(r.intv.nome)}${GT_GRUPPO==="perizia"?` <span class="muted" style="font-size:11px">· ${esc(nomeSito(r.sito))}</span>`:""}${r.lotto!=="Intero sito"?` <span class="gl">${esc(r.lotto)}</span>`:""}</div>

          r.si._err_scadenza?`<b style="color:var(--red)">scadenza non valida (${esc(r.si._err_scadenza)})</b>`:null].filter(Boolean).join(", ");
        return `<div class="sg-row"><span class="sg-n">${esc(r.intv.nome)} <span class="muted">· ${esc(nomeSito(r.sito))}</span></span><span class="sg-t">${cosa}</span></div>`;}).join("")}

        <span class="sg-t" style="color:${GT_COL[r.st.k]};font-weight:700">${esc(gtAllarme(r))}</span></div>`).join("")}</details></div>` : "";

  $("#pane-gantt").innerHTML=`
   <div class="card gt-tools">
     <div class="gt-tit"><h2 style="margin:0">📅 Gantt</h2>
       <button class="btn btn-o btn-sm" id="gt-xls" onclick="esportaGanttExcel()">⬇ Esporta in Excel</button></div>
     <div class="gt-ctl">

         <option value="settimane" ${sel(GT_SCALA,"settimane")}>Settimane</option><option value="mesi" ${sel(GT_SCALA,"mesi")}>Mesi</option></select></div>
     </div>
     <div class="gt-leg">
       <span><i class="lg-b" style="border-color:${GT_COL.ok};background:${gtHexA(GT_COL.ok,.28)}"><i style="background:${GT_COL.ok}"></i></i>attività e avanzamento</span>

function caricaExcelJS(){
  if(window.ExcelJS) return Promise.resolve();
  return new Promise((ok,ko)=>{ const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"; s.onload=ok; s.onerror=()=>ko(new Error("ExcelJS")); document.head.appendChild(s); });
}
window.esportaGanttExcel = async () => {

    const iOggi=M.basso.findIndex(u=>M.oggiStr>=u.a && M.oggiStr<u.b);
    M.basso.forEach((u,i)=>{ const c=hdr.getCell(NF+1+i); c.value=u.l; c.font={size:8,color:{argb:ARGB(i===iOggi?"#5B3D0E":"#1A2418")},bold:i===iOggi};
      c.fill=fill(i===iOggi?"#E8A33D":(M.scala==="giorni"&&u.fest?"#D5DACF":"#EEF1EA")); c.alignment={horizontal:"center"}; });
    for(let i=1;i<=NF;i++) ws.getCell(3,i).fill=fill("#E3E7DD");

    const bordoOggi={left:{style:"dashed",color:{argb:ARGB("#1A2418")}}};
    for(const g of M.gruppi){
      const r=riga(ws,rn++);
      r.values=[g.id,g.nome,diffGG(g.fine,g.inizio)+1,dataXl(g.inizio),dataXl(g.fine),null,null,g.avz,g.nAl?`${g.nAl} in allarme`:""];
      r.font={bold:true,size:10};
      for(let i=1;i<=NF;i++) r.getCell(i).fill=fill("#E9EFE2");
      M.basso.forEach((u,i)=>{ const c=r.getCell(NF+1+i);
        if(g.inizio<u.b && g.fine>=u.a) c.fill=fill("#2F3A2C");
        if(i===iOggi) c.border=bordoOggi; });
      for(const t of g.righe){
        const x=riga(ws,rn++), colr=GT_COL[t.st.k]||GT_COL.ok, pred=t.si.dipende_da?M.idDi.get(t.si.dipende_da):null;

          if(i===iOggi) c.border=bordoOggi; });
      }
    }
    for(let n=5;n<rn;n++){ const r=riga(ws,n); r.height=17;
      [4,5,6].forEach(i=>r.getCell(i).numFmt="dd/mm/yy"); r.getCell(8).numFmt="0%";
      for(let i=1;i<=NF;i++){ r.getCell(i).border={bottom:{style:"hair",color:{argb:ARGB("#C9CFC2")}}};
        r.getCell(i).alignment={vertical:"middle",horizontal:i===2?"left":"center"}; } }
    rn++;
    const leg=[["#3F7F3A","Avanzamento fatto"],[chiaro("#3F7F3A",.62),"Parte da fare"],["#D8912A","Margine stretto"],["#C0392B","In ritardo / non ci sta"],["#2F3A2C","Riepilogo"]];

    const r2=riga(ws,rn+leg.length); r2.getCell(1).value="▼"; r2.getCell(1).font={color:{argb:ARGB("#C0392B")},bold:true}; r2.getCell(1).alignment={horizontal:"center"};
    r2.getCell(2).value="Scadenza · colonna arancio in intestazione = oggi"; r2.getCell(2).font={size:9};
    ws.pageSetup={orientation:"landscape",paperSize:8,fitToPage:true,fitToWidth:1,fitToHeight:0,printTitlesRow:"3:4",
                  margins:{left:.3,right:.3,top:.4,bottom:.4,header:.2,footer:.2}};

    /* Foglio 2 — Elenco (tabella filtrabile) */
    const we=wb.addWorksheet("Elenco",{views:[{state:"frozen",ySplit:1}]});
    const cols=[["Sito",20],["Categoria perizia",18],["Lavorazione",36],["Lotto",14],["Priorità",10],["Durata (gg)",10],["Inizio",11],["Fine",11],["Scadenza",11],
      ["Predecessore",30],["Avanzamento",12],["Stato",18],["Gg necessari",12],["Gg disponibili",13],["Nota",46],["Dati mancanti",34]];
    we.columns=cols.map(([h,w])=>({header:h,width:w}));
    const h1=we.getRow(1); h1.font={bold:true,color:{argb:"FFFFFFFF"}}; h1.fill=fill("#1F5C2E"); h1.height=20; h1.alignment={vertical:"middle"};
    const tutte=[...M.pian.slice().sort((a,b)=>a.id-b.id), ...M.senza];
    for(const t of tutte){
      const pred=t.si.dipende_da?GT_RIGHE.righe.find(x=>x.si.id===t.si.dipende_da):null;
      const pian=!!(t.p.inizio&&t.p.fine);
      const manca=pian?(t.si.scadenza?"":(t.si._err_scadenza?"scadenza non valida":"scadenza")):t.p.ciclo?"dipendenza circolare":[!t.p.durata?"durata":null,
        t.si._err_data_inizio?"data inizio non valida ("+t.si._err_data_inizio+")":(!t.p.inizio?(pred?"attende il predecessore":"data inizio"):null)].filter(Boolean).join(", ");
      const r=we.addRow([nomeSito(t.sito),((DB.perizie.find(x=>x.id===t.intv.categoria_perizia_id)||{}).nome)||"",t.intv.nome,t.lotto,t.si.priorita||"",
        t.p.durata??null,dataXl(t.p.inizio),dataXl(t.p.fine),dataXl(t.si.scadenza),pred?pred.intv.nome:"",t.avz,
        pian?(t.si._err_scadenza?"scadenza non valida":t.st.l):"non pianificata",t.st.residua??null,t.st.disp??null,gtAllarme(t)+(t.si._err_scadenza?` Scadenza non valida (${t.si._err_scadenza}).`:""),manca]);
      [7,8,9].forEach(i=>r.getCell(i).numFmt="dd/mm/yy"); r.getCell(11).numFmt="0%";
      if(pian) r.getCell(12).font={color:{argb:ARGB(GT_COL[t.st.k]||"#1A2418")},bold:GT_CRIT.includes(t.st.k)};
      else r.getCell(12).font={color:{argb:ARGB("#6B7565")},italic:true};
    }
    we.autoFilter={from:{row:1,column:1},to:{row:Math.max(1,tutte.length+1),column:cols.length}};

    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`Halaesa_Gantt_${oggi()}.xlsx`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    toast("Excel scaricato ✓");

  btn.disabled=false; btn.textContent=testo;

/* ---- budget inseriti a mano (perizia / previsto) e scostamento dal setup ----
   Valori unici aziendali, tenuti in `parametri`. Modificabili solo dal super user.
   Scostamento = budget inserito - budget da setup; presentazione neutra. */
function kpiBudgetManuale(chiave, etichetta, budgetSetup){
  const v = +(DB.par?.[chiave]) || 0;
  const modificabile = isSuper() && !isReadOnly();
  const campo = modificabile
    ? `<input type="number" step="1000" class="kpi-inp" data-par="${chiave}" value="${v||""}" placeholder="—">`
    : `<b>${v?eur(v):"—"}</b>`;
  let sco = '<span class="kpi-sco">—</span>';
  if(v>0){
    const d=v-budgetSetup, pct=Math.round(d/v*1000)/10;
    const segno = d>0?"+":"";
    sco = `<span class="kpi-sco">${segno}${eur(d)} · ${segno}${pct.toLocaleString("it-IT",{maximumFractionDigits:1})}%</span>`;
  }
  return `<div class="k"><div class="kpi-b">${campo}</div><span>${etichetta}</span>
    <div class="kpi-sco-r">scostamento dal setup: ${sco}</div></div>`;
}
async function salvaBudgetManuale(chiave, valore){
  const {error}=await sb.from("parametri").upsert({chiave,valore});
  if(error) return toast("Errore di salvataggio");
  DB.par[chiave]=valore; toast("Budget salvato ✓"); rDash();
}
let chRef=null;
async function rDash(){
  const all = await calcTutti();
  let T={totale:0,interno:0,terzisti:0,ettari:0,budget:0,fermo:0,ettariTot:0};
  let scadAll=[];
  for(const {sito,D,R} of all){ scadenzeSito(sito.id,D,R).forEach(i=>scadAll.push(Object.assign({sito:nomeSito(sito)},i))); }
  const ordS={scaduto:0,'5':1,'10':2,'20':3,nd_tempo:4,ok:5,completato:6,nd:7};
  scadAll.sort((a,b)=>(ordS[a.stato]-ordS[b.stato])||((a.rim??1e9)-(b.rim??1e9)));
  for(const {sito,R} of all){const c=R.costi;T.totale+=c.totale;T.interno+=c.interno;T.terzisti+=c.terzisti;T.ettari+=R.ettari;T.budget+=c.budgetTot;T.fermo+=R.gg_fermo;T.ettariTot+=(+sito.ettari_totali||0);}
  // consolidamento
  const cons = all.map(({sito,R})=>`<tr><td>${esc(nomeSito(sito))}</td>
    <td>${Math.round(R.avz*100)}%</td><td>${R.ettari.toLocaleString("it-IT",{maximumFractionDigits:1})}</td>
    <td>${eur(R.costi.interno)}</td><td>${eur(R.costi.terzisti)}</td>
    <td title="materiali interni e preventivi maturati">${eur(R.costi.totale)}</td><td>${eur(R.costi.budgetTot)}</td></tr>`).join("");
  // categorie presenti in almeno un sito (per heatmap avanzamento sito×categoria)

  const haV=eff.map(e=>e.eurHa).filter(v=>v!=null); const haMin=Math.min(...haV,0),haMax=Math.max(...haV,1);
  const fMax=Math.max(1,...eff.map(e=>e.fermo));
  const C={ott:"#1F5C2E",buono:"#8CBF66",att:"#E8A33D",crit:"#C0392B"};
  const colScala=(v,lo,hi,inv)=>{if(v==null||!isFinite(v))return null;let t=(v-lo)/((hi-lo)||1);t=Math.min(Math.max(t,0),1);if(inv)t=1-t;return t>=0.75?C.ott:t>=0.5?C.buono:t>=0.25?C.att:C.crit;};

   </div>
   ${segnalazioni(all)}
   <div class="switch">
     <button class="${VISTA==="categorie"?"on":""}" onclick="setVista('categorie')">Per lavorazione</button>

   <div class="card"><h2>Heatmap avanzamento (sito × ${VISTA==="perizia"?"categoria perizia":"categoria"})</h2><div class="scroll-x">${heat}</div></div>

     <p class="muted" style="margin-bottom:12px">Indicatori confrontabili tra siti. Verde = buono, rosso = critico. €/ha e giorni fermo: colore relativo al portfolio (più basso = meglio).</p>
     <div class="scroll-x"><div id="eff-box">${effHead}${effBody}</div></div>
     <div class="efflegend"><span><span class="sw" style="background:#1F5C2E"></span>ottimo</span><span><span class="sw" style="background:#8CBF66"></span>buono</span><span><span class="sw" style="background:#E8A33D"></span>attenzione</span><span><span class="sw" style="background:#C0392B"></span>critico</span><span><span class="sw" style="background:#E6E8E1"></span>n/d</span></div>
   </div>
   ${isReadOnly()?"":`<div class="card"><h2>Esporta dati (CSV)</h2><div class="row2">
     <button class="btn btn-g btn-sm" id="csv-consol" style="margin-bottom:8px">consolidamento interventi</button>

     <p class="muted" style="margin-top:6px">Il <b>consuntivo</b> riporta per ogni sito ore personale, macchine e carburanti in euro, con il totale. I ritardi sono in giorni di fermo: nel modello non hanno un valore in euro.</p></div>`}
   </div>`;
  const csvOut=(nome,righe)=>{
    if(righe.length<2) return toast("Nessun dato da esportare");
    dlCsv(nome, righe.map(r=>r.join(",")).join("\n"));
  };
  const Q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const nomeInt=siId=>{ for(const {D} of all){ const si=(D.sito_interventi||[]).find(x=>x.id===siId);
      if(si){ const i=DB.interventi.find(y=>y.id===si.intervento_id); return i?i.nome:"?"; } } return "?"; };
  if($("#csv-ore")) $("#csv-ore").onclick=()=>{

        r.push([Q(o.data),Q(sito.nome),Q(nomeInt(o.sito_intervento_id)),Q(op.nome||"?"),ore,tar,Math.round(ore*tar*100)/100]);
      }));

      .sort((a,b)=>String(a.data).localeCompare(String(b.data)))

      sito.nome, p.lotto, catNome(p.categoria_id), pzNome(p.perizia_id), p.nome, p.modalita, p.priorita||"",

      p.daVerificare?"SI":"", p.mancanti.join("; ")
    ].map(v=>`"${String(v).replace(/"/g,'""')}"`))));

    const rows=[["sito","ore_personale_eur","macchine_eur","carburanti_eur","totale_consuntivo_eur","ritardi_giorni"]];
    let tOre=0,tMac=0,tCarb=0,tTot=0,tGg=0;
    all.forEach(({sito,R})=>{
      const c=R.costi, tot=c.ore+c.macchine+c.carburanti;
      tOre+=c.ore; tMac+=c.macchine; tCarb+=c.carburanti; tTot+=tot; tGg+=R.gg_fermo;
      rows.push([`"${sito.nome.replace(/"/g,'""')}"`,Math.round(c.ore),Math.round(c.macchine),Math.round(c.carburanti),Math.round(tot),R.gg_fermo]);
    });
    rows.push(['"TOTALE"',Math.round(tOre),Math.round(tMac),Math.round(tCarb),Math.round(tTot),tGg]);
    dlCsv("consuntivo_per_sito.csv",rows.map(r=>r.join(",")).join("\n"));
  };
}
async function exportCsv(table){
  const {data}=await sb.from(table).select("*");
  if(!data||!data.length)return toast("Nessun dato da esportare");
  const cols=Object.keys(data[0]);
  const csv=[cols.join(","),...data.map(r=>cols.map(c=>JSON.stringify(r[c]??"")).join(","))].join("\n");
  dlCsv(table+".csv",csv);
}
function dlCsv(name,content){
  const blob=new Blob([content],{type:"text/csv"});const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;a.click();
}

/* ---- mappa della compilazione: si tocca la zona invece di cercarla a menù ---- */
let MS=null;
async function mappaScelta(aree, sito){
  const box=$("#c-samap"); if(!box||!aree.length) return;
  try{ await caricaLeaflet(); }catch(e){ box.innerHTML='<p class="muted" style="padding:12px">Mappa non disponibile: usa il menù qui sopra.</p>'; return; }
  if(MS){ try{ MS.remove(); }catch(e){} MS=null; }
  box.innerHTML="";
  MS=L.map(box,{maxZoom:20,attributionControl:true,zoomControl:true});
  L.tileLayer.wms(SITR_WMS,{layers:"0",format:"image/jpeg",version:"1.3.0",
    transparent:false,maxZoom:20,attribution:SITR_ATTR}).addTo(MS);
  const tutti=[];
  aree.forEach(a=>{
    const pts=daGeoJSON(a.geom); if(pts.length<3) return;
    tutti.push(...pts);
    const scelta = SA_SEL===a.id;
    const p=L.polygon(pts,{
      color: scelta?"#1F5C2E":"#FAFAF7", weight: scelta?4:2,
      fillColor: scelta?"#8CBF66":"#1A2418", fillOpacity: scelta?0.45:0.12
    }).addTo(MS);
    p.bindTooltip(`${a.nome} · ${ha(a.ettari)}`,{permanent:scelta,direction:"center",className:"sa-lab"});
    p.on("click",()=>{ if(SA_SEL!==a.id){ SA_SEL=a.id; rCompila(); } });
    p.on("mouseover",()=>{ if(SA_SEL!==a.id) p.setStyle({fillOpacity:0.3}); });
    p.on("mouseout", ()=>{ if(SA_SEL!==a.id) p.setStyle({fillOpacity:0.12}); });
  });
  if(tutti.length) MS.fitBounds(L.latLngBounds(tutti),{padding:[20,20],maxZoom:19});
  else {
    const st=DB.siti.find(x=>x.id===sito)||{};
    if(st.mappa_lat!=null) MS.setView([+st.mappa_lat,+st.mappa_lng], st.mappa_zoom||17);
  }
  setTimeout(()=>{ try{ MS.invalidateSize(); }catch(e){} }, 250);
}

/* ====================== SOTTO-AREE: ORTOFOTO SITR E DISEGNO ======================
   Ortofoto 2022 a 20 cm della Regione Siciliana, servita in WMS. Parla
   EPSG:3857, quindi entra in una mappa Leaflet senza conversioni.
   Leaflet si carica solo qui: chi compila non se lo porta dietro. */
const SITR_WMS="https://map.sitr.regione.sicilia.it/gis/services/ortofoto/ortofoto_2022_20cm_sicilia/ImageServer/WMSServer";
/* Attribuzione come la chiede la CC BY 4.0: opera, titolare, fonte,
   licenza con link, e dichiarazione che l'immagine non e' modificata.
   Compare nell'angolo della mappa e, per esteso, sotto la mappa. */
const SITR_OPERA="Ortofoto della Regione Siciliana 2022, risoluzione 20 cm";
const SITR_FONTE="https://www.sitr.regione.sicilia.it/";
const SITR_LIC="https://creativecommons.org/licenses/by/4.0/deed.it";
const SITR_ATTR='Ortofoto 2022 (20 cm), non modificata · '
  +'<a href="'+SITR_FONTE+'" target="_blank" rel="noopener">Regione Siciliana — S.I.T.R.</a> · '
  +'<a href="'+SITR_LIC+'" target="_blank" rel="noopener">CC BY 4.0</a>';
const SITR_CREDITO='<b>Fonte della mappa:</b> '+SITR_OPERA
  +' — Regione Siciliana, Assessorato Territorio e Ambiente, Sistema Informativo Territoriale Regionale (S.I.T.R.), '
  +'<a href="'+SITR_FONTE+'" target="_blank" rel="noopener">sitr.regione.sicilia.it</a>. '
  +'Distribuita con licenza <a href="'+SITR_LIC+'" target="_blank" rel="noopener">Creative Commons Attribuzione 4.0 Internazionale (CC BY 4.0)</a>. '
  +'Le immagini sono consultate tramite servizio WMS e visualizzate senza alcuna modifica.';
const SICILIA=[37.6,14.0];
function caricaLeaflet(){
  if(window.L) return Promise.resolve();
  return new Promise((ok,ko)=>{
    const css=document.createElement("link");
    css.rel="stylesheet"; css.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
    document.head.appendChild(css);
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    s.onload=()=>ok(); s.onerror=()=>ko(new Error("Leaflet")); document.head.appendChild(s);
  });
}
/* superficie di un poligono geografico, in ettari (eccesso sferico) */
const R_TERRA=6378137;
function ettariDi(pts){
  if(!pts||pts.length<3) return 0;
  const d=Math.PI/180; let a=0;
  for(let i=0,n=pts.length;i<n;i++){
    const p1=pts[i], p2=pts[(i+1)%n];
    a += (p2[1]-p1[1])*d*(2+Math.sin(p1[0]*d)+Math.sin(p2[0]*d));
  }
  return Math.abs(a*R_TERRA*R_TERRA/2)/10000;
}
const ha = n => (+n||0).toLocaleString("it-IT",{maximumFractionDigits:2})+" ha";
/* [lat,lng] dell'app <-> GeoJSON Polygon [lng,lat] con anello chiuso */
const versoGeoJSON = pts => ({type:"Polygon",
  coordinates:[[...pts.map(p=>[p[1],p[0]]),[pts[0][1],pts[0][0]]]]});
function daGeoJSON(g){
  const anello=(g&&g.coordinates&&g.coordinates[0])||[];
  const pts=anello.map(c=>[+c[1],+c[0]]);
  if(pts.length>1){
    const a=pts[0], b=pts[pts.length-1];
    if(a[0]===b[0]&&a[1]===b[1]) pts.pop();
  }
  return pts;
}

/* ---- ricerca di un luogo: l'ortofoto da sola e' indistinguibile,
   serve un modo per arrivare sul campo senza vagare. Nominatim
   (OpenStreetMap) copre discretamente contrade e toponimi rurali. ---- */
const GEOCODER="https://nominatim.openstreetmap.org/search";
/* coordinate incollate a mano o prese da un link di Google Maps:
   e' la via di scampo quando la contrada non esiste nelle mappe pubbliche */
function coordinateDa(testo){
  const t=String(testo||"").trim();
  const g=t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)              // .../@37.98,14.23,17z
       || t.match(/[?&]q=(-?\d+\.\d+),\s*(-?\d+\.\d+)/)       // ...?q=37.98,14.23
       || t.match(/^(-?\d{1,2}[.,]\d+)[\s,;]+(-?\d{1,3}[.,]\d+)$/);
  if(!g) return null;
  const lat=parseFloat(String(g[1]).replace(",",".")), lng=parseFloat(String(g[2]).replace(",","."));
  if(!isFinite(lat)||!isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180) return null;
  return [lat,lng];
}
async function cercaLuogo(testo, comune){
  const u=new URL(GEOCODER);
  u.searchParams.set("q", comune ? `${testo}, ${comune}, Sicilia` : `${testo}, Sicilia`);
  u.searchParams.set("format","jsonv2");
  u.searchParams.set("countrycodes","it");
  u.searchParams.set("accept-language","it");
  u.searchParams.set("limit","6");
  const r=await fetch(u.toString(),{headers:{Accept:"application/json"}});
  if(!r.ok) throw new Error("geocoder "+r.status);
  return await r.json();
}

  box.innerHTML="";

  const wms=L.tileLayer.wms(SITR_WMS,{layers:"0",format:"image/jpeg",version:"1.3.0",
    transparent:false,maxZoom:20,attribution:SITR_ATTR}).addTo(map);
  let avvisato=false;
  wms.on("tileerror",()=>{ if(avvisato) return; avvisato=true;
    toast("Ortofoto SITR non raggiungibile: puoi comunque rivedere le aree già salvate"); });
  SA={map,sid,aree,strati:[],modo:null,punti:[],linea:null,vertici:[],target:null,bozza:null,segno:null};
  inquadra();
  collegaImport();
  map.on("click",e=>{ if(SA.modo==="dividi") puntoTaglio(e.latlng); });

}
function collegaRicerca(){
  const inp=$("#a-q"), btn=$("#a-vai"), btn2=$("#a-gps"), box=$("#a-ris");
  if(!inp||!btn||!btn2||!box) return;
  const sito=DB.siti.find(x=>x.id===SA.sid)||{};
  const comune=(DB.comuni.find(c=>c.id===sito.comune_id)||{}).nome||"";
  const vaiA=(lat,lng,bb,precisione)=>{
    if(bb) SA.map.fitBounds([[+bb[0],+bb[2]],[+bb[1],+bb[3]]],{maxZoom:17});
    else SA.map.setView([lat,lng],17);
    // un segno rosso dove siamo atterrati: senza, in mezzo al verde ci si perde
    if(SA.segno) SA.map.removeLayer(SA.segno);
    const g=L.layerGroup().addTo(SA.map);
    L.circleMarker([lat,lng],{radius:9,color:"#C0392B",weight:3,
      fillColor:"#C0392B",fillOpacity:.25}).addTo(g);
    // il cerchio dice quanto fidarsi del punto: un fix da wifi puo' sbagliare di km
    if(precisione>0) L.circle([lat,lng],{radius:precisione,color:"#C0392B",weight:1,
      dashArray:"4,4",fillColor:"#C0392B",fillOpacity:.06}).addTo(g);
    SA.segno=g;
    box.innerHTML="";
  };
  const dovMiTrovo=()=>{
    if(!navigator.geolocation) return toast("Questo dispositivo non fornisce la posizione");
    if(!window.isSecureContext)
      return toast("La posizione funziona solo se l'app è aperta in https");
    btn2.disabled=true; const testo=btn2.textContent; btn2.textContent="Cerco la posizione…";
    const fine=()=>{ btn2.disabled=false; btn2.textContent=testo; };
    navigator.geolocation.getCurrentPosition(p=>{
      fine();
      const pr=Math.round(p.coords.accuracy||0);
      vaiA(p.coords.latitude,p.coords.longitude,null,pr);
      toast(pr>150 ? `Posizione approssimativa (±${pr} m): controlla di essere sul campo giusto`
                   : `Sei qui (±${pr} m) ✓`);
    }, e=>{
      fine();
      const m={1:"Permesso negato: autorizza la posizione nelle impostazioni del browser",
               2:"Posizione non disponibile in questo momento",
               3:"Il dispositivo non ha trovato la posizione in tempo: riprova all'aperto"};
      box.innerHTML=`<p class="muted">${esc(m[e.code]||"Non sono riuscito a leggere la posizione")}. In alternativa scrivi la contrada, o incolla delle coordinate.</p>`;
    }, {enableHighAccuracy:true, timeout:12000, maximumAge:30000});
  };
  // la strada che funziona sempre, scritta dove serve invece che in un manuale
  const comeFare = (premessa) => `<p class="muted" style="font-size:12px;margin-top:6px">
    ${premessa} Apri il campo su Google Maps, fai tasto destro sul punto (o tieni premuto, sul telefono),
    tocca le coordinate per copiarle e incollale qui sopra: la mappa ci va esatta.
    Se invece sei sul posto, usa <b>Dove mi trovo</b>.</p>`;
  const cerca=async()=>{
    const t=inp.value.trim();
    if(!t) return;
    const c=coordinateDa(t);
    if(c){ vaiA(c[0],c[1]); return toast("Mappa spostata sulle coordinate ✓"); }
    box.innerHTML=`<p class="muted">Cerco…</p>`;
    let ris;
    try{ ris=await cercaLuogo(t,comune); }
    catch(e){ box.innerHTML=comeFare("Servizio di ricerca non raggiungibile."); return; }
    if(!ris.length){ box.innerHTML=comeFare(`Nessun risultato per «${esc(t)}»${comune?` in ${esc(comune)}`:""}.`); return; }
    // molte contrade non sono mappate, e capita che il risultato sia in un altro
    // comune con un nome simile: va segnalato, non nascosto
    box.innerHTML=ris.map((r,i)=>{
      const nome=String(r.display_name).split(",")[0];
      const resto=String(r.display_name).split(",").slice(1,4).join(",").trim();
      const fuori=comune && !String(r.display_name).toLowerCase().includes(comune.toLowerCase());
      return `<button type="button" data-i="${i}">
        <b>${esc(nome)}${fuori?` <span class="flag-y">fuori da ${esc(comune)}</span>`:""}</b>
        <span>${esc(resto)}${r.type?" · "+esc(r.type):""}</span></button>`;
    }).join("")
      +`<p class="muted" style="font-size:11px;margin-top:4px">Ricerca luoghi: dati © collaboratori OpenStreetMap, servizio Nominatim. Le contrade rurali spesso non vi compaiono.</p>`
      +comeFare("Non è quello giusto?");
    box.querySelectorAll("button").forEach(b=>b.onclick=()=>{
      const r=ris[+b.dataset.i];
      vaiA(+r.lat,+r.lon,r.boundingbox);
    });
  };
  btn.onclick=cerca;
  btn2.onclick=dovMiTrovo;
  inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); cerca(); } };
}
function inquadra(){
  const {map,aree,sid}=SA, sito=DB.siti.find(x=>x.id===sid)||{};
  const tutti=aree.flatMap(a=>daGeoJSON(a.geom));
  if(tutti.length){ map.fitBounds(L.latLngBounds(tutti),{padding:[30,30],maxZoom:19}); return; }
  if(sito.mappa_lat!=null&&sito.mappa_lng!=null){
    map.setView([+sito.mappa_lat,+sito.mappa_lng], sito.mappa_zoom||17); return; }
  const c=DB.comuni.find(x=>x.id===sito.comune_id);
  if(c&&c.lat!=null) map.setView([+c.lat,+c.lng],14);
  else map.setView(SICILIA,8);
}
function pitturaAree(){
  SA.strati.forEach(l=>SA.map.removeLayer(l)); SA.strati=[];
  for(const a of SA.aree){
    const pts=daGeoJSON(a.geom); if(pts.length<3) continue;
    const p=L.polygon(pts,{color:"#1F5C2E",weight:2,fillColor:"#8CBF66",fillOpacity:.28,
      interactive:false}).addTo(SA.map);
    p.bindTooltip(`${a.nome} · ${ha(a.ettari)}`,{permanent:true,direction:"center",className:"sa-lab"});
    SA.strati.push(p);
  }
}

function ridisegnaBozza(){

      ? L.polygon(SA.punti,{color:"#C0392B",weight:2,dashArray:"5,5",fillColor:"#C0392B",fillOpacity:.15})
      : L.polyline(SA.punti,{color:"#C0392B",weight:2,dashArray:"5,5"});

function pulisciBozza(){
